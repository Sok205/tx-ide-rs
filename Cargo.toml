[workspace]
resolver = "3"
members = ["tx-core", "plugins/engine-claude", "plugins/engine-codex", "plugins/chat", "plugins/labels", "plugins/kill", "plugins/picker", "plugins/edit", "plugins/spawn", "plugins/assistant", "plugins/mockup", "plugins/tutor", "plugins/artifacts", "plugins/tour", "plugins/timeline", "plugins/graph", "plugins/home", "plugins/home-themes", "plugins/layouts", "tx-client", "tx-core-cli"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
tx-core = { path = "tx-core" }
tx-client = { path = "tx-client" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sha2 = "0.10"
libc = "0.2"
serde_norway = "0.9"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Lean debug builds: every agent worktree has its own target/, so the full debuginfo of the
# default dev profile (several GB per worktree) adds up. Workspace crates keep file:line for
# backtraces; dependencies carry no debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
