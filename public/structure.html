<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tx-core interface graph</title>
<style>
:root {
  --bg: #1e1e1e; --bg-2: #252525; --bg-hover: #333; --border: #353535;
  --text: #dcddde; --muted: #9a9a9a; --faint: #666; --accent: #8b7cf6; --accent-2: #a99cff;
  --code-bg: #191919; --warn: #e5a54b; --note: #5fa8e8;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.55 var(--font); overflow: hidden; }
a { color: var(--accent-2); text-decoration: none; cursor: pointer; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #3b3b3b; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
#app { display: grid; grid-template-columns: 250px 1fr 480px; height: 100vh; }
#app.no-panel { grid-template-columns: 250px 1fr 0; }
#app.embed { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
#app.embed #panel { display: none; }
html.embed.resizing-panel, html.embed.resizing-panel * { cursor: row-resize !important; user-select: none; }
#app.embed #index, #app.embed .legend { display: none; }
#app.embed #panel { border-left: 0; border-top: 1px solid var(--border); }
#app.embed #card { padding: 12px 18px 40px; }
@font-face { font-family: "Fira Sans"; font-weight: 400; src: url("static.files/FiraSans-Regular-0fe48ade.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-weight: 500; src: url("static.files/FiraSans-Medium-e1aa3f0a.woff2") format("woff2"); }
@font-face { font-family: "Source Code Pro"; font-weight: 400; src: url("static.files/SourceCodePro-Regular-8badfe75.ttf.woff2") format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 400; src: url("static.files/SourceSerif4-Regular-6b053e98.ttf.woff2") format("woff2"); }
/* Embedded in rustdoc: rustdoc's fonts and theme variables (light defaults, replaced by the page's). */
html.embed {
  --main-background-color: white; --main-color: black; --sidebar-background-color: #f5f5f5;
  --sidebar-background-color-hover: #e0e0e0; --border-color: #e0e0e0; --headings-border-bottom-color: #ddd;
  --code-block-background-color: #f5f5f5; --button-background-color: #fff; --right-side-color: grey;
  --link-color: #3873ad; --mod-link-color: #3873ad; --type-link-color: #ad378a; --trait-link-color: #6e4fc9;
  --function-link-color: #ad7c37; --target-background-color: #fdffd3; --target-border-color: #ad7c37;
  --warning-border-color: #ff8e00; --search-input-focused-border-color: #66afe9;
  --scrollbar-track-background-color: #dcdcdc; --scrollbar-thumb-background-color: rgba(36,37,39,.6);
  --ui-font: "Fira Sans", Arial, NanumBarunGothic, sans-serif; --code-font: "Source Code Pro", monospace;
}
html.embed.waiting body { visibility: hidden; }
html.embed, html.embed body { background: var(--main-background-color); color: var(--main-color); font: 15px/1.5 var(--ui-font); }
html.embed ::-webkit-scrollbar-track { background: var(--scrollbar-track-background-color); }
html.embed ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb-background-color); border: 0; }
html.embed #graph-area { background: var(--main-background-color); }
/* Graph controls live in a settings popover, closed by default. */
html.embed .toolbar { display: none; }
#config-button, #config, #mode-seg { display: none; }
html.embed #mode-seg { display: flex; position: absolute; top: 8px; left: 10px; z-index: 3; margin: 0; }
html.embed #mode-seg button:disabled { opacity: .4; cursor: default; }
html.embed #config-button { right: 10px; }
html.embed #config-button { display: block; position: absolute; top: 8px; z-index: 3; width: 30px; height: 30px; padding: 0; border: 1px solid var(--border-color); border-radius: 4px; background: var(--main-background-color); color: var(--right-side-color); font-size: 18px; line-height: 28px; cursor: pointer; }
html.embed #config-button:hover, html.embed #config-button.on { color: var(--main-color); border-color: var(--right-side-color); }
html.embed #config.open { display: block; position: absolute; top: 44px; right: 10px; z-index: 4; width: 270px; padding: 10px 14px 12px; background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.15); font: 14px var(--ui-font); }
html.embed #config .config-title { font-weight: 500; font-size: 15px; margin: 10px 0 5px; }
html.embed #config .config-title:first-child { margin-top: 0; }
html.embed #config .config-row { display: flex; flex-wrap: wrap; gap: 6px; }
html.embed #config .toggle { display: flex; border: 0; padding: 2px 0; background: none; }
html.embed #config .config-row:has(.toggle) { flex-direction: column; gap: 0; }
html.embed #config .legend { display: block; position: static; background: none; padding: 0; font-size: 13px; line-height: 1.5; color: var(--right-side-color); }
html.embed #config .legend b { color: var(--main-color); font-weight: 500; }
.legend-row { display: flex; align-items: center; gap: 10px; line-height: 1.75; }
.legend-row svg { flex: none; overflow: visible; }
html.embed #config .legend-row { color: var(--main-color); font-size: 13.5px; }
.legend-pill { fill: var(--main-background-color, #2b2b2b); stroke: var(--border-color, #555); }
.legend-pill.legend-hidden { stroke: var(--warning-border-color, #e5a54b); stroke-dasharray: 3 2; }
.legend-name { font: 9.5px var(--code-font, monospace); fill: var(--main-color, #ddd); }
.legend-count { font: 600 10px var(--ui-font, sans-serif); fill: var(--main-color, #ddd); paint-order: stroke; stroke: var(--main-background-color, #1a1a1a); stroke-width: 3px; }
html.embed .btn, html.embed .toggle { background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 4px; color: var(--main-color); font: 14px var(--ui-font); padding: 2px 9px; }
html.embed .btn:hover, html.embed .toggle:hover { border-color: var(--right-side-color); color: var(--main-color); }
html.embed .toggle input { accent-color: var(--link-color); }
html.embed .viewseg { background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 4px; }
html.embed .viewseg button { font: 14px var(--ui-font); color: var(--main-color); padding: 2px 11px; }
html.embed .viewseg button.on { background: var(--sidebar-background-color-hover); font-weight: 500; }
html.embed #tip { background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 4px; color: var(--main-color); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
html.embed #tip .t { color: var(--main-color); font: 500 14px var(--ui-font); }
html.embed #tip .v { color: var(--right-side-color); font: 13px var(--code-font); }
html.embed .mod-box { fill: var(--sidebar-background-color); stroke: var(--border-color); }
html.embed .mod.collapsed .mod-box { fill: var(--sidebar-background-color); }
html.embed .mod:hover .mod-box { stroke: var(--right-side-color); }
html.embed .mod.sel .mod-box { stroke: var(--link-color); stroke-width: 1.5; }
html.embed .mod-name { fill: var(--mod-link-color); font: 500 15px var(--ui-font); }
html.embed .mod-sub, html.embed .mod-toggle { fill: var(--right-side-color); font-family: var(--ui-font); }
html.embed .item rect.pill { fill: var(--main-background-color); stroke: var(--border-color); }
html.embed .item:hover rect.pill { stroke: var(--right-side-color); fill: var(--main-background-color); }
html.embed .item.sel rect.pill { fill: var(--target-background-color); stroke: var(--target-border-color); stroke-width: 1.5; }
html.embed .item.nb rect.pill { stroke: var(--link-color); }
html.embed .item.hidden rect.pill { stroke: var(--warning-border-color); stroke-dasharray: 3 2; }
html.embed .item text.name { font: 13px var(--code-font); }
html.embed .item text.kind-struct, html.embed .item text.kind-enum, html.embed .item text.kind-type { fill: var(--type-link-color); }
html.embed .item text.kind-trait { fill: var(--trait-link-color); }
html.embed .item text.kind-fn { fill: var(--function-link-color); }
html.embed .item text.kind-const { fill: var(--link-color); }
html.embed .item.mod-path text.name { font-style: italic; opacity: .75; }
html.embed .item .warn-dot { fill: var(--warning-border-color); }
html.embed .edge text { fill: var(--main-color); stroke: var(--main-background-color); font: 12px var(--ui-font); }
html.embed svg.focused .item:not(.nb):not(.sel) { opacity: .5; }
html.embed #panel { background: var(--main-background-color); color: var(--main-color); border-top: 1px solid var(--border-color); }
html.embed #card { padding: 14px 24px 30px; }
.toolbar .viewseg { margin: 0; }
.toolbar .viewseg button { padding: 3px 12px; }
.docs-link { font: 12px var(--font); margin-left: 8px; }

/* index */
#index { background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
#index .top { padding: 14px 14px 8px; }
.brand { font-weight: 650; display: flex; align-items: center; gap: 8px; }
.brand .gem { width: 12px; height: 12px; transform: rotate(45deg); background: linear-gradient(135deg, var(--accent-2), var(--accent)); border-radius: 3px; }
.ref { font: 11px var(--mono); color: var(--faint); margin: 2px 0 10px; }
#filter { width: 100%; padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: 13px var(--font); outline: none; }
#filter:focus { border-color: var(--accent); }
#list { overflow: auto; flex: 1; padding: 4px 8px 12px; }
.group { margin-top: 10px; }
.group-label { font: 600 12px var(--mono); color: #bdbdbd; padding: 3px 8px; cursor: pointer; display: flex; align-items: center; gap: 7px; border-radius: 5px; }
.group-label:hover { background: var(--bg-hover); color: #fff; }
.group-label .mdot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.entry.modpath { color: #858585; font-style: italic; }
.entry.empty-mod { color: var(--faint); font-size: 12px; font-style: italic; cursor: default; padding-left: 26px; }
.entry.empty-mod:hover { background: none; }
.group.muted .entry { color: #8d8d8d; }
.entry { display: flex; align-items: center; gap: 7px; padding: 1px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cfcfcf; }
.entry:hover { background: var(--bg-hover); }
.entry.active, .group-label.active { background: rgba(139,124,246,.22); color: #fff; }
.entry.sub { padding-left: 26px; font: 12.5px var(--mono); }
.entry .flag { margin-left: 6px; color: var(--warn); font-size: 11px; }
.entry .count { margin-left: auto; color: var(--faint); font: 10.5px var(--mono); }
.entry .count + .flag { margin-left: 6px; }
.entry .caret { width: 12px; flex: none; color: var(--muted); font-size: 12px; line-height: 1; text-align: center; }
.entry .caret[data-caret]:hover { color: var(--text); }
.entry.sub { padding-left: 40px; }
.sub-label { padding-left: 40px !important; }
.sub-label { font-size: 10.5px; color: var(--faint); padding: 3px 8px 0 26px; }
.badge { font: 600 9.5px var(--mono); padding: 0 4px; border-radius: 3px; color: #1e1e1e; flex: none; width: 15px; text-align: center; line-height: 15px; }
.b-struct { background: #ffcb6b; } .b-enum { background: #f78c6c; } .b-trait { background: #4fd1e8; } .b-fn { background: #82aaff; }
.b-const { background: #9a9a9a; } .b-method { background: #c3a6ff; } .b-type { background: #c3e88d; }
#keys { border-top: 1px solid var(--border); padding: 8px 14px; font-size: 11.5px; color: var(--faint); line-height: 1.8; }
kbd { font: 10.5px var(--mono); border: 1px solid #474747; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: #222; }

/* graph */
#graph-area { position: relative; min-width: 0; background: #1a1a1a; overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#svg.panning { cursor: grabbing; }
.toolbar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 2; }
.toolbar > * { pointer-events: auto; }
.btn { background: rgba(40,40,40,.95); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.btn:hover { color: var(--text); border-color: #555; }
.toggle { display: inline-flex; gap: 6px; align-items: center; background: rgba(40,40,40,.95); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); margin: 0; }
.legend { position: absolute; bottom: 10px; left: 12px; font-size: 11.5px; color: var(--faint); background: rgba(26,26,26,.9); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.legend b { color: var(--muted); font-weight: 500; }
.viewseg { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; margin-bottom: 10px; }
.viewseg button { flex: 1; background: none; border: 0; padding: 5px 0; font: 600 12.5px var(--font); color: var(--muted); cursor: pointer; }
.viewseg button.on { background: rgba(139,124,246,.28); color: #fff; }
.viewseg button:hover { color: var(--text); }
.item.hidden rect.pill { stroke: #8a6d3b; stroke-dasharray: 3 2; }
.item.mod-path text.name { font-style: italic; }
.impl .row.dim { opacity: .62; }
.chip.vis-private, .chip.vis-crate { background: #2f2f2f; color: #9a9a9a; }
.chip.vis-hidden { background: rgba(229,165,75,.14); color: var(--warn); }
.chip.vis-public { background: rgba(99,193,116,.15); color: #7fd18f; }
#tip { position: absolute; pointer-events: none; background: rgba(30,30,30,.97); border: 1px solid #444; border-radius: 7px; padding: 6px 10px; font-size: 12.5px; display: none; max-width: 360px; z-index: 5; }
#tip .t { font: 600 12.5px var(--mono); color: #fff; }
#tip .v { color: var(--muted); font: 12px var(--mono); }
.mod-box { fill: #222; stroke: #3a3a3a; stroke-width: 1; }
.mod.collapsed .mod-box { fill: #262626; }
.mod:hover .mod-box { stroke: #666; }
.mod.sel .mod-box { stroke: var(--accent-2); stroke-width: 2; }
.mod-head { cursor: pointer; }
.mod-name { fill: #ececec; font: 600 13.5px var(--font); }
.mod-sub { fill: #8a8a8a; font: 11px var(--mono); }
.mod-toggle { fill: #8a8a8a; font: 600 15px var(--mono); }
.item { cursor: pointer; }
.item rect.pill { fill: #2b2b2b; stroke: #3d3d3d; stroke-width: 1; }
.item:hover rect.pill { stroke: #7a7a7a; fill: #313131; }
.item.sel rect.pill { stroke: #fff; stroke-width: 1.8; fill: #343046; }
.item.nb rect.pill { stroke: #8b7cf6; }
.item text.name { fill: #e2e2e2; font: 12.5px var(--mono); }
.item.mod-path text.name { fill: #9a9a9a; }
.item text.badge-t { font: 700 9.5px var(--mono); fill: #1e1e1e; }
.item .warn-dot { fill: var(--warn); }
.edge path.line { fill: none; }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge text { font: 600 10.5px var(--mono); fill: #c8c8c8; paint-order: stroke; stroke: #1a1a1a; stroke-width: 3px; pointer-events: none; }
svg.focused .edge:not(.hot) path.line { opacity: .06 !important; }
svg.focused .edge:not(.hot) text { opacity: 0; }
svg.focused .item:not(.nb):not(.sel) { opacity: .45; }
.edge.hot path.line { opacity: 1 !important; }
.edge.via-hot path.line { stroke-width: 3.2 !important; }
/* Hovering an object (or a module) isolates its connections, without redrawing. */
svg.hovering .edge:not(.hover-hot) path.line { opacity: .06 !important; }
svg.hovering .edge:not(.hover-hot) text { opacity: 0; }
svg.hovering .edge.hover-hot path.line { opacity: 1 !important; }
svg.hovering .item:not(.hover-self):not(.hover-nb) { opacity: .3; }
svg.hovering .mod:not(.hover-self):not(.hover-nb) .mod-head { opacity: .45; }
svg.hovering .item.hover-self rect.pill { stroke-width: 2; }

/* panel */
#panel { background: var(--bg-2); border-left: 1px solid var(--border); overflow: auto; min-width: 0; }
#card { padding: 18px 22px 120px; }
.crumbs { font-size: 12px; color: var(--faint); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px; }
.crumbs a { color: var(--muted); }
.siblings { display: flex; gap: 10px; } .siblings a { color: var(--muted); } .siblings a:hover { color: var(--text); }
h1 { font: 700 21px var(--mono); margin: 0 0 6px; word-break: break-word; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { font: 11px var(--mono); padding: 1px 7px; border-radius: 10px; background: #2f2f2f; color: var(--muted); }
.chip.warn { background: rgba(229,165,75,.14); color: var(--warn); }
.summary { color: #cdcdcd; margin: 4px 0 14px; font-size: 14px; }
.summary code, .note code, .prose code { font: 12px var(--mono); background: #2f2f2f; padding: 1px 5px; border-radius: 4px; color: #e7a5d0; }
pre.decl { background: var(--code-bg); border: 1px solid #2c2c2c; border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; overflow: auto; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; }
.impl { background: var(--code-bg); border: 1px solid #2c2c2c; border-radius: 8px; padding: 8px 0 10px; margin: 0 0 12px; font: 12.5px/1.55 var(--mono); }
.impl .open, .impl .close { padding: 0 14px; }
.impl .section { padding: 8px 14px 1px 28px; color: #6a737d; font-style: italic; }
.impl .row { padding: 2px 14px 2px 28px; border-left: 2px solid transparent; }
.impl .row:hover { background: #222; border-left-color: var(--accent); }
.impl .row .sig { white-space: pre-wrap; text-indent: -2ch; padding-left: 2ch; }
.impl .row .what { font: 12px/1.45 var(--font); color: #8a8a8a; }
.tok-kw { color: #c792ea; } .tok-str { color: #c3e88d; } .tok-com { color: #6a737d; font-style: italic; }
.tok-num { color: #f78c6c; } .tok-ty { color: #ffcb6b; } .tok-mac { color: #89ddff; } .tok-attr { color: #6f7c93; }
.tok-fn { color: #82aaff; } .tok-life { color: #f07178; } .tok-self { color: #f07178; font-style: italic; }
a.ref { color: inherit; border-bottom: 1px solid rgba(169,156,255,.45); }
a.ref:hover { border-bottom-color: var(--accent-2); background: rgba(139,124,246,.16); }
a.ref.method-name { color: #82aaff; font-weight: 600; border-bottom: 0; }
h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 600; margin: 18px 0 6px; }
.dep { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; align-items: baseline; }
.dep .to { font: 12.5px var(--mono); white-space: nowrap; }
.dep .via { color: var(--faint); font: 11.5px var(--mono); }
.dep .via a { color: #9d9d9d; } .dep .via a:hover { color: var(--text); }
.none { color: var(--faint); font-size: 12.5px; font-style: italic; }
.note { border-radius: 6px; padding: 8px 12px 2px; margin: 0 0 12px; background: rgba(95,168,232,.07); border-left: 3px solid var(--note); font-size: 13px; }
.note.warning { background: rgba(229,165,75,.08); border-color: var(--warn); }
.note .t { font-weight: 600; margin-bottom: 2px; color: var(--note); font-size: 12.5px; }
.note.warning .t { color: var(--warn); }
.note p { margin: 0 0 6px; }
.prose { font-size: 13px; color: #cfcfcf; } .prose p { margin: 0 0 8px; }
.priv { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.mod-items { columns: 2; font: 12.5px var(--mono); }
.mod-items div { break-inside: avoid; }

#preview { position: fixed; z-index: 50; max-width: 600px; max-height: 400px; overflow: hidden; background: #232323; border: 1px solid #444; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.5); padding: 10px 14px; display: none; pointer-events: none; }
#preview .p-title { font: 600 13px var(--mono); margin-bottom: 2px; }
#preview .p-sum { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
#preview pre { margin: 0; font: 12px/1.5 var(--mono); white-space: pre; }
#switcher { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 60; }
#switcher.open { display: flex; }
#switcher .box { width: 620px; background: #262626; border: 1px solid #444; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.6); overflow: hidden; }
#switcher input { width: 100%; padding: 14px 16px; background: transparent; border: 0; border-bottom: 1px solid #383838; color: var(--text); font: 15px var(--font); outline: none; }
#switcher .results { max-height: 420px; overflow: auto; padding: 6px; }
#switcher .r { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
#switcher .r.sel { background: rgba(139,124,246,.25); }
#switcher .r .n { font: 13px var(--mono); }

05, "tags": ["struct", "public"], "mentions": ["core/TxCore", "plugin/Plugin", "session/Launch", "session/Lifecycle", "session/SessionId"]}, {"id": "session/RecordError", "name": "RecordError", "title": "RecordError", "kind": "enum", "module": "session", "visibility": "public", "doc": [], "summary": "", "note": null, "declaration": "#[derive(Debug, thiserror::Error)]\npub enum RecordError {\n    Json(#[from] serde_json::Error),\n    UnsupportedVersion(u64),\n    InvalidVersion(String),\n    MissingVersion,\n    NonFiniteTime(&'static str),\n}", "display": null, "sections": [], "line": 207, "lastLine": 219, "tags": ["enum", "public"], "mentions": []}, {"id": "session/validate_name", "name": "validate_name", "title": "validate_name", "kind": "fn", "module": "session", "visibility": "public", "doc": ["`[A-Za-z0-9_-]+`, at most `MAX_NAME_BYTES`. The grammar keeps names safe as exact tmux targets", "(`=name`) and as path fragments."], "summary": "`[A-Za-z0-9_-]+`, at most `MAX_NAME_BYTES`.", "note": null, "declaration": "pub fn validate_name(name: &str) -> Result<(), CoreError>;", "display": "pub fn validate_name(name: &str) -> Result<(), CoreError>;", "sections": [], "line": 284, "lastLine": 292, "tags": ["fn", "public"], "mentions": ["error/CoreError"]}, {"id": "store/ReadError", "name": "ReadError", "title": "ReadError", "kind": "enum", "module": "store", "visibility": "public", "doc": ["Why one record file could not be read."], "summary": "Why one record file could not be read.", "note": null, "declaration": "#[derive(Debug, thiserror::Error)]\npub enum ReadError {\n    Io(#[from] io::Error),\n    Utf8(std::str::Utf8Error),\n    Record(#[from] RecordError),\n    NotAFile,\n    IdMismatch { found: String },\n}", "display": null, "sections": [], "line": 12, "lastLine": 25, "tags": ["enum", "public"], "mentions": ["session/RecordError"]}, {"id": "store/StoreError", "name": "StoreError", "title": "StoreError", "kind": "enum", "module": "store", "visibility": "public", "doc": [], "summary": "", "note": null, "declaration": "#[derive(Debug, thiserror::Error)]\npub enum StoreError {\n    Io {\n        path: PathBuf,\n        #[source]\n        source: io::Error,\n    },\n    /// A record file exists but cannot be read. Named so a human can inspect or remove it.\n    Unreadable {\n        file: String,\n        #[source]\n        source: ReadError,\n    },\n    /// The session cannot be written as JSON (non-UTF-8 `cwd`, non-finite timestamp).\n    Encode {\n        id: SessionId,\n        #[source]\n        source: RecordError,\n    },\n}", "display": null, "sections": [], "line": 27, "lastLine": 49, "tags": ["enum", "public"], "mentions": ["session/RecordError", "session/SessionId", "store/ReadError"]}, {"id": "tmux/TmuxError", "name": "TmuxError", "title": "TmuxError", "kind": "enum", "module": "tmux", "visibility": "public", "doc": [], "summary": "", "note": null, "declaration": "#[derive(Debug, thiserror::Error)]\npub enum TmuxError {\n    Spawn {\n        binary: String,\n        #[source]\n        source: io::Error,\n    },\n    Failed { args: String, stderr: String },\n    /// `list-sessions` failed for a reason other than \"no server\": the answer is unknown, not\n    /// \"nothing is live\". Callers must write nothing.\n    InspectionFailed { stderr: String },\n}", "display": null, "sections": [], "line": 17, "lastLine": 31, "tags": ["enum", "public"], "mentions": []}, {"id": "events/PIPE_BUF", "name": "PIPE_BUF", "title": "PIPE_BUF", "kind": "const", "module": "events", "visibility": "module-path", "doc": ["The smallest `PIPE_BUF` among supported platforms (macOS); a line at most this long is", "appended in one atomic write. The newline counts."], "summary": "The smallest `PIPE_BUF` among supported platforms (macOS); a line at most this long is appended in one atomic write.", "note": null, "declaration": "pub const PIPE_BUF: usize = 512;", "display": null, "sections": [], "line": 17, "lastLine": 19, "tags": ["const", "public"], "mentions": []}, {"id": "events/EventType", "name": "EventType", "title": "EventType", "kind": "enum", "module": "events", "visibility": "public", "doc": ["Every event type core logs."], "summary": "Every event type core logs.", "note": null, "declaration": "#[derive(Clone, Copy, Debug, PartialEq, Eq, Hash)]\n#[non_exhaustive]\npub enum EventType {\n    Created,\n    Renamed,\n    Tagged,\n    MessageSent,\n    Exited,\n    Stopped,\n    Forgotten,\n}", "display": null, "sections": [{"label": "Accessors", "methods": ["events/EventType::as_str"]}], "line": 21, "lastLine": 32, "tags": ["enum", "public"], "mentions": []}, {"id": "events/Event", "name": "Event", "title": "Event", "kind": "struct", "module": "events", "visibility": "public", "doc": ["One thing that happened to one session. Handed to in-process sinks and written to the log."], "summary": "One thing that happened to one session.", "note": "`{ ts, type_, id, name, actor, detail }`. `actor` is the sender for `message-sent`; `detail` is human text, not a contract. Seven [[EventType]]s.", "declaration": "#[derive(Clone, Debug, PartialEq)]\n#[non_exhaustive]\npub struct Event {\n    pub ts: f64,\n    pub type_: EventType,\n    pub id: SessionId,\n    pub name: String,\n    /// The sending session for `message-sent`; `None` means the user or core itself.\n    pub actor: Option<SessionId>,\n    /// Human-readable detail (the old name on a rename, the tag list, …). Not a contract.\n    pub detail: String,\n}", "display": null, "sections": [{"label": "Constructors", "methods": ["events/Event::new"]}], "line": 58, "lastLine": 70, "tags": ["struct", "public"], "mentions": ["events/EventType", "session/SessionId"]}, {"id": "events/EventSink", "name": "EventSink", "title": "EventSink", "kind": "trait", "module": "events", "visibility": "public", "doc": ["An in-process listener. Called after the operation's record is saved and every lock is", "released, in registration order; cannot veto; never receives a handle to the core (open a", "second `TxCore` on the same state dir if you need one). Hand slow work to your own thread.", "", "Order is per core: another process's events reach you only through the log, and log order", "across processes is write order, not causal order.", "", "A panicking sink is contained with `catch_unwind`: the operation already happened and the", "log line is already written. The default panic hook still prints the panic to stderr (core", "installs no hook; that is the front end's call), the sink's own `Mutex`es are poisoned", "afterwards, and nothing is contained under `panic = \"abort\"`.", "", "Closures (`|e: &Event| …`) and `Arc<impl EventSink>` are sinks. The closure impl rules out a", "future blanket impl for `Box<T>` or `&T`; box your sink when registering it."], "summary": "An in-process listener.", "note": "`on_event(&self, &Event)`. Blanket impls for closures and `Arc<T>`.\n\nContract: called after the record is saved and every lock released, in registration order; cannot veto; gets no core handle. A sink that needs one opens a second [[TxCore]] on the same state dir — the `hooks` plugin does exactly that to seed `{\"state\": \"idle\"}` via [[TxCore::update_ext]] on `Created`.\n\nSinks only see their own process's events; other processes are visible only through `log.jsonl`.", "declaration": "pub trait EventSink: Send + Sync {\n    fn on_event(&self, event: &Event);\n}", "display": "pub trait EventSink: Send + Sync {\n    fn on_event(&self, event: &Event);\n}", "sections": [{"label": "Required", "methods": ["events/EventSink::on_event"]}], "line": 91, "lastLine": 107, "tags": ["trait", "public"], "mentions": ["events/Event"]}, {"id": "events/now", "name": "now", "title": "now", "kind": "fn", "module": "events", "visibility": "module-path", "doc": ["Seconds since the epoch as a float."], "summary": "Seconds since the epoch as a float.", "note": null, "declaration": "pub fn now() -> f64;", "display": "pub fn now() -> f64;", "sections": [], "line": 169, "lastLine": 175, "tags": ["fn", "public"], "mentions": []}, {"id": "events/encode", "name": "encode", "title": "encode", "kind": "fn", "module": "events", "visibility": "module-path", "doc": ["Compact JSON + newline, `msg` trimmed on a char boundary so the line fits `PIPE_BUF`."], "summary": "Compact JSON + newline, `msg` trimmed on a char boundary so the line fits `PIPE_BUF`.", "note": "Compact JSON + newline, trimmed so the whole line fits [[PIPE_BUF]] (512, the macOS value). That plus one `O_APPEND` `write_all` is why concurrent writers never tear lines. Trimming walks the message char by char using [[escaped_len]], so the cut is on a char boundary and the result is still valid JSON.", "declaration": "pub fn encode(ts: f64, actor: &str, type_: &str, id: &str, name: &str, msg: &str) -> Vec<u8>;", "display": "pub fn encode(\n    ts: f64,\n    actor: &str,\n    type_: &str,\n    id: &str,\n    name: &str,\n    msg: &str,\n) -> Vec<u8>;", "sections": [], "line": 187, "lastLine": 205, "tags": ["fn", "public"], "mentions": []}, {"id": "messaging/build_envelope", "name": "build_envelope", "title": "build_envelope", "kind": "fn", "module": "messaging", "visibility": "public", "doc": ["`sender: None` is the user; `Some(name)` is another agent, named by its session name."], "summary": "`sender: None` is the user; `Some(name)` is another agent, named by its session name.", "note": null, "declaration": "pub fn build_envelope(sender: Option<&str>, text: &str) -> String;", "display": "pub fn build_envelope(\n    sender: Option<&str>,\n    text: &str,\n) -> String;", "sections": [], "line": 13, "lastLine": 19, "tags": ["fn", "public"], "mentions": []}, {"id": "profile/ROLE_SUFFIX", "name": "ROLE_SUFFIX", "title": "ROLE_SUFFIX", "kind": "const", "module": "profile", "visibility": "module-path", "doc": [], "summary": "", "note": null, "declaration": "pub const ROLE_SUFFIX: &str = \".md\";", "display": null, "sections": [], "line": 10, "lastLine": 10, "tags": ["const", "public"], "mentions": []}, {"id": "profile/LOCAL_SUFFIX", "name": "LOCAL_SUFFIX", "title": "LOCAL_SUFFIX", "kind": "const", "module": "profile", "visibility": "module-path", "doc": [], "summary": "", "note": null, "declaration": "pub const LOCAL_SUFFIX: &str = \".local.md\";", "display": null, "sections": [], "line": 11, "lastLine": 11, "tags": ["const", "public"], "mentions": []}, {"id": "profile/SKILL_FILE", "name": "SKILL_FILE", "title": "SKILL_FILE", "kind": "const", "module": "profile", "visibility": "module-path", "doc": [], "summary": "", "note": null, "declaration": "pub const SKILL_FILE: &str = \"SKILL.md\";", "display": null, "sections": [], "line": 12, "lastLine": 12, "tags": ["const", "public"], "mentions": []}, {"id": "profile/RoleError", "name": "RoleError", "title": "RoleError", "kind": "enum", "module": "profile", "visibility": "public", "doc": ["A bad role or skill grant. Fail loudly, never guess."], "summary": "A bad role or skill grant.", "note": null, "declaration": "#[derive(Debug, thiserror::Error)]\npub enum RoleError {\n    InvalidName(String),\n    UnknownRole {\n        name: String,\n        searched: Vec<PathBuf>,\n    },\n    UnknownSkill {\n        name: String,\n        searched: Vec<PathBuf>,\n    },\n    UnclosedFrontmatter(PathBuf),\n    Read {\n        path: PathBuf,\n        #[source]\n        source: io::Error,\n    },\n}", "display": null, "sections": [], "line": 15, "lastLine": 44, "tags": ["enum", "public"], "mentions": []}, {"id": "profile/Profiles", "name": "Profiles", "title": "Profiles", "kind": "struct", "module": "profile", "visibility": "public", "doc": ["Role and skill search dirs, in order; a later dir overrides an earlier one."], "summary": "Role and skill search dirs, in order; a later dir overrides an earlier one.", "note": null, "declaration": "#[derive(Clone, Debug, PartialEq, Eq)]\npub struct Profiles {\n    /* private fields */\n}", "display": null, "sections": [{"label": "Constructors", "methods": ["profile/Profil d(String),\n    Workspace { path: PathBuf, reason: String },\n}", "display": null, "sections": [], "line": 13, "lastLine": 22, "tags": ["enum", "public"], "mentions": []}, {"id": "engine/LaunchRequest", "name": "LaunchRequest", "title": "LaunchRequest", "kind": "struct", "module": "engine", "visibility": "public", "doc": ["What core asks an engine to turn into a command line. Borrowed: `launch` is pure."], "summary": "What core asks an engine to turn into a command line.", "note": null, "declaration": "#[derive(Clone, Copy, Debug)]\n#[non_exhaustive]\npub struct LaunchRequest<'a> {\n    pub cwd: &'a Path,\n    /// Combined role text, the file holding it, and the granted skill dirs.\n    pub profile: &'a Profile,\n    pub model: Option<&'a str>,\n    pub effort: Option<Effort>,\n    pub initial_prompt: Option<&'a str>,\n    /// An engine-specific conversation id to continue instead of starting fresh. Core never\n    /// interprets it.\n    pub resume: Option<&'a str>,\n}", "display": null, "sections": [{"label": "Constructors", "methods": ["engine/LaunchRequest::new"]}, {"label": "Builder setters", "methods": ["engine/LaunchRequest::model", "engine/LaunchRequest::effort", "engine/LaunchRequest::initial_prompt", "engine/LaunchRequest::resume"]}], "line": 24, "lastLine": 37, "tags": ["struct", "public"], "mentions": ["profile/Profile", "session/Effort"]}, {"id": "engine/WorkspaceAction", "name": "WorkspaceAction", "title": "WorkspaceAction", "kind": "enum", "module": "engine", "visibility": "public", "doc": ["Filesystem preparation core performs before starting the process. Relative paths resolve", "against the session's `cwd`; a path that escapes `cwd` is refused."], "summary": "Filesystem preparation core performs before starting the process.", "note": null, "declaration": "#[derive(Clone, Debug, PartialEq, Eq)]\n#[non_exhaustive]\npub enum WorkspaceAction {\n    /// Writes `content` to `path`, creating parents, overwriting.\n    Write { path: PathBuf, content: String },\n    /// Links `dst` → `src` (`src` is the link target, used verbatim). Replaces an existing\n    /// symlink; refuses an existing file or directory.\n    Symlink { src: PathBuf, dst: PathBuf },\n}", "display": null, "sections": [], "line": 72, "lastLine": 82, "tags": ["enum", "public"], "mentions": []}, {"id": "engine/LaunchPlan", "name": "LaunchPlan", "title": "LaunchPlan", "kind": "struct", "module": "engine", "visibility": "public", "doc": ["How to start the engine: `program args…`, extra environment, and workspace preparation."], "summary": "How to start the engine: `program args…`, extra environment, and workspace preparation.", "note": null, "declaration": "#[derive(Clone, Debug, Default, PartialEq, Eq)]\n#[non_exhaustive]\npub struct LaunchPlan {\n    pub program: String,\n    pub args: Vec<String>,\n    pub env: Vec<(String, String)>,\n    pub workspace: Vec<WorkspaceAction>,\n}", "display": null, "sections": [{"label": "Constructors", "methods": ["engine/LaunchPlan::new"]}, {"label": "Builder setters", "methods": ["engine/LaunchPlan::program", "engine/LaunchPlan::arg", "engine/LaunchPlan::args", "engine/LaunchPlan::env", "engine/LaunchPlan::workspace"]}], "line": 84, "lastLine": 92, "tags": ["struct", "public"], "mentions": ["engine/WorkspaceAction"]}, {"id": "engine/EngineAdapter", "name": "EngineAdapter", "title": "EngineAdapter", "kind": "trait", "module": "engine", "visibility": "public", "doc": ["One coding-agent engine. Two required methods; no I/O in `launch`. `Send + Sync` so a core", "can be shared across threads."], "summary": "One coding-agent engine.", "note": "Two required methods, [[EngineAdapter::id]] and [[EngineAdapter::launch]], plus an optional [[EngineAdapter::envelope]].\n\nThe design point: `launch` is **pure**. The adapter only describes program, args, env and [[WorkspaceAction]]s in a [[LaunchPlan]]; core does all I/O in [[TxCore::create_locked]]. So an adapter is unit-testable without a filesystem or tmux.", "declaration": "pub trait EngineAdapter: Send + Sync {\n    /// A bare name (`[A-Za-z0-9_-]+`); stored in every record this engine launches.\n    fn id(&self) -> &str;\n    fn launch(&self, req: &LaunchRequest<'_>) -> Result<LaunchPlan, EngineError>;\n    /// How a message is framed before it is typed into one of this engine's sessions.\n    /// `sender` is the sending session's name, `None` for the user. Pure; the default is the\n    /// `<from-user>` / `<from-agent session=\"…\">` envelope.\n    fn envelope(&self, sender: Option<&str>, text: &str) -> String;  // provided\n}", "display": "pub trait EngineAdapter: Send + Sync {\n    /// A bare name (`[A-Za-z0-9_-]+`); stored in every record this engine launches.\n    fn id(&self) -> &str;\n    fn launch(\n        &self,\n        req: &LaunchRequest<'_>,\n    ) -> Result<LaunchPlan, EngineError>;\n    /// How a message is framed before it is typed into one of this engine's sessions.\n    /// `sender` is the sending session's name, `None` for the user. Pure; the default is the\n    /// `<from-user>` / `<from-agent session=\"…\">` envelope.\n    fn envelope(\n        &self,\n        sender: Option<&str>,\n        text: &str,\n    ) -> String;  // provided\n}", "sections": [{"label": "Required", "methods": ["engine/EngineAdapter::id", "engine/EngineAdapter::launch"]}, {"label": "Provided", "methods": ["engine/EngineAdapter::envelope"]}], "line": 129, "lastLine": 142, "tags": ["trait", "public"], "mentions": ["engine/EngineError", "engine/LaunchPlan", "engine/LaunchRequest"]}, {"id": "engine/resolve_in", "name": "resolve_in", "title": "resolve_in", "kind": "fn", "module": "engine", "visibility": "module-path", "doc": ["`path` against `cwd`, both normalized lexically (`.` and `..` folded), refused if the result", "leaves `cwd` or `cwd` is not absolute. Lexical on purpose: it never touches the filesystem,", "so the check happens before any write. It cannot see symlinks; adapters are trusted code and", "core canonicalizes `cwd` before launching, which is as far as a lexical check can go."], "summary": "`path` against `cwd`, both normalized lexically (`.` and `..` folded), refused if the result leaves `cwd` or `cwd` is not absolute.", "note": null, "declaration": "pub fn resolve_in(cwd: &Path, path: &Path) -> Result<PathBuf, EngineError>;", "display": "pub fn resolve_in(\n    cwd: &Path,\n    path: &Path,\n) -> Result<PathBuf, EngineError>;", "sections": [], "line": 183, "lastLine": 204, "tags": ["fn", "public"], "mentions": ["engine/EngineError"]}, {"id": "engine/apply_workspace", "name": "apply_workspace", "title": "apply_workspace", "kind": "fn", "module": "engine", "visibility": "module-path", "doc": ["Applies `actions` in order against `cwd`. Every target path is checked before anything is", "written, so a bad action late in the list leaves the workspace untouched."], "summary": "Applies `actions` in order against `cwd`.", "note": "Resolves every action's target with [[resolve_in]] (lexical normalize, refuse escaping cwd) **before** writing anything, so a bad action late in the list leaves the workspace untouched. `Write` creates parents and overwrites; `Symlink` replaces a symlink but refuses an existing file or directory.\n\n> [!note] Lexical only\n> It can't see symlinks inside cwd. The docs say adapters are trusted code.", "declaration": "pub fn apply_workspace(cwd: &Path, actions: &[WorkspaceAction]) -> Result<(), EngineError>;", "display": "pub fn apply_workspace(\n    cwd: &Path,\n    actions: &[WorkspaceAction],\n) -> Result<(), EngineError>;", "sections": [], "line": 227, "lastLine": 260, "tags": ["fn", "public"], "mentions": ["engine/EngineError", "engine/WorkspaceAction"]}, {"id": "plugin/Plugin", "name": "Plugin", "title": "Plugin", "kind": "trait", "module": "plugin", "visibility": "public", "doc": [], "summary": "", "note": "`id()` plus `register(&mut Registry)`. One trait, many capabilities: a plugin fills whichever [[Registry]] slots it needs — engines, sinks, verbs, resources. A ne <dyn EventSink>);", "display": "pub fn subscribe(&mut self, sink: Box<dyn EventSink>);", "sections": [], "line": 380, "lastLine": 383, "tags": ["method", "public"], "mentions": ["events/EventSink"]}, {"id": "core/TxCore::list_sessions", "name": "list_sessions", "title": "TxCore::list_sessions", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Store only, never tmux — cheap, and possibly stale: a `Running` record may already be gone until someone refreshes. Filters with [[ListFilter::matches]] (all fields are conjuncts). Returns ids; callers [[TxCore::get_session]] each.", "noteFrom": null, "declaration": "pub fn list_sessions(&self, filter: &ListFilter) -> Result<Vec<SessionId>, CoreError>;", "display": "pub fn list_sessions(\n    &self,\n    filter: &ListFilter,\n) -> Result<Vec<SessionId>, CoreError>;", "sections": [], "line": 403, "lastLine": 411, "tags": ["method", "public"], "mentions": ["core/ListFilter", "error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::get_session", "name": "get_session", "title": "TxCore::get_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "One [[SessionStore::load]]; `NotFound` when there's no file.", "noteFrom": null, "declaration": "pub fn get_session(&self, id: &SessionId) -> Result<Session, CoreError>;", "display": "pub fn get_session(\n    &self,\n    id: &SessionId,\n) -> Result<Session, CoreError>;", "sections": [], "line": 413, "lastLine": 417, "tags": ["method", "public"], "mentions": ["error/CoreError", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::resolve", "name": "resolve", "title": "TxCore::resolve", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["An id first, then a name: the `Running` record with it, else the most recently created."], "summary": "An id first, then a name: the `Running` record with it, else the most recently created.", "note": "Exact id wins if the record exists. Otherwise among records with that name: the `Running` one, else the newest. Names are unique only among running records ([[TxCore::name_in_use]]), which is why stopped or exited duplicates exist and need this tie-break.", "noteFrom": null, "declaration": "pub fn resolve(&self, name_or_id: &str) -> Result<SessionId, CoreError>;", "display": "pub fn resolve(\n    &self,\n    name_or_id: &str,\n) -> Result<SessionId, CoreError>;", "sections": [], "line": 419, "lastLine": 442, "tags": ["method", "public"], "mentions": ["error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::create_session", "name": "create_session", "title": "TxCore::create_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "A thin wrapper: [[TxCore::create_locked]] does the work and returns its events; this method [[TxCore::emit]]s them after the lock is released. Every mutation follows this split.", "noteFrom": null, "declaration": "pub fn create_session(&self, opts: CreateOptions) -> Result<SessionId, CoreError>;", "display": "pub fn create_session(\n    &self,\n    opts: CreateOptions,\n) -> Result<SessionId, CoreError>;", "sections": [], "line": 446, "lastLine": 450, "tags": ["method", "public", "emits", "reaches-tmux", "reaches-write"], "mentions": ["core/CreateOptions", "error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::rename_session", "name": "rename_session", "title": "TxCore::rename_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Takes `create.lock` **then** `<id>.lock` — the documented order. Same name: no-op, no event. `NameTaken` against other running records. If running and live, renames the tmux session via its `$N` target (a tmux `duplicate session` also maps to `NameTaken`), then saves. Terminal records are renamed in the record only.", "noteFrom": "TxCore::rename_locked", "declaration": "pub fn rename_session(&self, id: &SessionId, name: &str) -> Result<Session, CoreError>;", "display": "pub fn rename_session(\n    &self,\n    id: &SessionId,\n    name: &str,\n) -> Result<Session, CoreError>;", "sections": [], "line": 636, "lastLine": 640, "tags": ["method", "public", "emits", "reaches-tmux", "reaches-write"], "mentions": ["error/CoreError", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::update_ext", "name": "update_ext", "title": "TxCore::update_ext", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["Runs `f` on `ext[plugin]` (`Null` when absent) under the session lock and saves the", "record if the value changed; leaving it `Null` removes the key. Returns whether a write", "happened. `f` must not call back into the core (the lock is held)."], "summary": "Runs `f` on `ext[plugin]` (`Null` when absent) under the session lock and saves the record if the value changed; leaving it `Null` removes the key.", "note": "Under `<id>.lock`, hands the closure `ext[plugin]` (`Null` when absent) and saves only if it changed; leaving it `Null` removes the key. The closure must not call back into core — the lock is held.\n\n> [!warning] No event\n> Unlike every other mutation this emits nothing, so sinks and `log.jsonl` never see plugin state changes on a record.", "noteFrom": null, "declaration": "pub fn update_ext(&self, id: &SessionId, plugin: &str, f: impl FnOnce(&mut serde_json::Value)) -> Result<bool, CoreError>;", "display": "pub fn update_ext(\n    &self,\n    id: &SessionId,\n    plugin: &str,\n    f: impl FnOnce(&mut serde_json::Value),\n) -> Result<bool, CoreError>;", "sections": [], "line": 681, "lastLine": 709, "tags": ["method", "public", "session-lock", "writes-record", "reaches-write"], "mentions": ["error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::set_session_tags", "name": "set_session_tags", "title": "TxCore::set_session_tags", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Replaces the whole list. Same shape as the other mutations, but inlined: a block holds `<id>.lock` for load–modify–save, then [[TxCore::emit]] runs after the block. Allowed on terminal records.", "noteFrom": null, "declaration": "pub fn set_session_tags(&self, id: &SessionId, tags: Vec<String>) -> Result<Session, CoreError>;", "display": "pub fn set_session_tags(\n    &self,\n    id: &SessionId,\n    tags: Vec<String>,\n) -> Result<Session, CoreError>;", "sections": [], "line": 711, "lastLine": 726, "tags": ["method", "public", "session-lock", "emits", "writes-record", "reaches-write"], "mentions": ["error/CoreError", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::refresh_session", "name": "refresh_session", "title": "TxCore::refresh_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["One `list-sessions`; a `Running` record without a live `@tx-id` becomes `Exited`."], "summary": "One `list-sessions`; a `Running` record without a live `@tx-id` becomes `Exited`.", "note": "Under `<id>.lock`. A terminal record is returned untouched without asking tmux. Otherwise one [[Tmux::list_live]]; a running record whose `@tx-id` is missing becomes `Exited` via [[TxCore::mark_exited]]. Never revives.", "noteFrom": null, "declaration": "pub fn refresh_session(&self, id: &SessionId) -> Result<RefreshResult, CoreError>;", "display": "pub fn refresh_session(\n    &self,\n    id: &SessionId,\n) -> Result<RefreshResult, CoreError>;", "sections": [], "line": 728, "lastLine": 742, "tags": ["method", "public", "session-lock", "tmux", "emits", "reaches-tmux", "reaches-write"], "mentions": ["core/RefreshResult", "error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::refresh_all", "name": "refresh_all", "title": "TxCore::refresh_all", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["One `list-sessions` for every record; returns the records that changed. Records are", "scanned before tmux is listed: a record exists only after its tmux session does, so a", "record missing from a later listing has truly gone (the other order would mark a session", "created between the two calls as exited)."], "summary": "One `list-sessions` for every record; returns the records that changed.", "note": "Reads records **before** listing tmux: a record only exists after its tmux session does, so the reverse order would mark a session created in between as `Exited`. Each candidate is reloaded under its own lock (another process may have stopped it), and its event is emitted right after that lock drops.", "noteFrom": null, "declaration": "pub fn refresh_all(&self) -> Result<Vec<Session>, CoreError>;", "display": "pub fn refresh_all(&self) -> Result<Vec<Session>, CoreError>;", "sections": [], "line": 744, "lastLine": 774, "tags": ["method", "public", "session-lock", "tmux", "emits", "reaches-tmux", "reaches-write"], "mentions": ["error/CoreError", "session/Session"]}, {"id": "core/TxCore::get_execution_location", "name": "get_execution_location", "title": "TxCore::get_execution_location", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "A terminal record is `NotRunning` without asking tmux; otherwise looks the session up by `@tx-id`. No lock — it reads tmux, it doesn't write. `txc attach` execs `tmux -S <socket> attach -t $N` with `TMUX` unset.", "noteFrom": null, "declaration": "pub fn get_execution_location(&self, id: &SessionId) -> Result<ExecutionLocation, CoreError>;", "display": "pub fn get_execution_location(\n    &self,\n    id: &SessionId,\n) -> Result<ExecutionLocation, CoreError>;", "sections": [], "line": 785, "lastLine": 795, "tags": ["method", "public", "tmux", "reaches-tmux"], "mentions": ["core/ExecutionLocation", "error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::stop_session", "name": "stop_session", "title": "TxCore::stop_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["`kill-session`, then `Stopped`. A record whose session had already vanished becomes", "`Exited` instead (what happened, not what was asked)."], "summary": "`kill-session`, then `Stopped`.", "note": "Under `<id>.lock`. If tmux still has it: `kill-session`, mark `Stopped`, event `stopped`. If it had already vanished: mark `Exited` instead — what happened, not what was asked. The record stays.", "noteFrom": null, "declaration": "pub fn stop_session(&self, id: &SessionId) -> Result<Session, CoreError>;", "display": "pub fn stop_session(\n    &self,\n    id: &SessionId,\n) -> Result<Session, CoreError>;", "sections": [], "line": 816, "lastLine": 839, "tags": ["method", "public", "session-lock", "tmux", "emits", "writes-record", "reaches-tmux", "reaches-write"], "mentions": ["error/CoreError", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::forget_session", "name": "forget_session", "title": "TxCore::forget_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["Deletes the record (and its profile file). The tmux session, if any, keeps running and is", "no longer managed. `Ok(false)` when there was no record."], "summary": "Deletes the record (and its profile file).", "note": "Under `<id>.lock`: delete `<id>.json` and `profiles/<id>.md`. The tmux session keeps running unmanaged — and still holds the name, so a later create of that name gets `NameTaken` from tmux.\n\nThe load used to find the name for the event swallows errors (`.ok().flatten()`), so a corrupt record can still be forgotten.", "noteFrom": null, "declaration": "pub fn forget_session(&self, id: &SessionId) -> Result<bool, CoreError>;", "display": "pub fn forget_session(\n    &self,\n    id: &SessionId,\n) -> Result<bool, CoreError>;", "sections": [], "line": 841, "lastLine": 871, "tags": ["method", "public", "session-lock", "emits", "writes-record", "reaches-write"], "mentions": ["error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::send_message", "name": "send_message", "title": "TxCore::send_message", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Holds the recipient's `<id>.lock` for the **whole** delivery, so concurrent senders never interleave keystrokes. Recipient must be `Running` and live, else `NotRunning`. A named sender must exist (any lifecycle). Framing via [[TxCore::envelope_for]], typing via [[deliver]].\n\n> [!warning] 300 ms under the lock\n> N concurrent messages to one agent take at least N × 300 ms. Intentional, but worth confirming as acceptable.", "noteFrom": null, "declaration": "pub fn send_message(&self, to: &SessionId, text: &str, opts: SendOptions) -> Result<DeliveryReceipt, CoreError>;", "display": "pub fn send_message(\n    &self,\n    to: &SessionId,\n    text: &str,\n    opts: SendOptions,\n) -> Result<DeliveryReceipt, CoreError>;", "sections": [], "line": 875, "lastLine": 912, "tags": ["method", "public", "session-lock", "emits", "reaches-tmux"], "mentions": ["core/DeliveryReceipt", "core/SendOptions", "error/CoreError", "session/SessionId"]}, {"id": "plugin/TxCore::plug", "name": "plug", "title": "TxCore::plug", "kind": "method", "module": "plugin", "visibility": "public", "owner": "core/TxCore", "doc": ["Registers every plugin not in `cfg.disabled`, in order. Fails on the first problem; the", "core may then hold a partial registration and the caller should exit."], "summary": "Registers every plugin not in `cfg.disabled`, in order.", "note": "[[load]] validates ids, unknown ids in the config and duplicates, then runs every enabled plugin's `register` on a fresh [[Registry]]. Then engines go to [[TxCore::register_engine]], sinks to [[TxCore::subscribe]], verbs through [[insert_verb]] (reserved / duplicate checks), resources into the host list.\n\n> [!warning] Partial registration on failure\n> Fails on the first problem and leaves whatever was registered so far. Fine for `txc`, which exits; sharp for any other embedder.", "noteFrom": null, "declaration": "pub fn plug(&mut self, plugins: Vec<Box<dyn Plugin>>, cfg: &PluginConfig) -> Result<(), PluginError>;", "display": "pub fn plug(\n    &mut self,\n    plugins: Vec<Box<dyn Plugin>>,\n    cfg: &PluginConfig,\n) -> Result<(), PluginError>;", "sections": [], "line": 292, "lastLine": 330, "tags": ["method", "public"], "mentions": ["plugin/Plugin", "plugin/PluginConfig", "plugin/PluginError"]}, {"id": "plugin/TxCore::verb", "name": "verb", "title": "TxCore::verb", "kind": "method", "module": "plugin", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": null, "noteFrom": null, "declaration": "pub fn verb(&self, name: &str) -> Option<Arc<dyn Verb>>;", "display": "pub fn verb(&self, name: &str) -> Option<Arc<dyn Verb>>;", "sections": [], "line": 332, "lastLine": 334, "tags": ["method", "public"], "mentions": ["plugin/Verb"]}, {"id": "plugin/TxCore::verbs", "name": "verbs", "title": "TxCore::verbs", "kind": "method", "module": "plugin", "visibility": "public", "owner": "core/TxCore", "doc": ["Every plugin verb, by name."], "summary": "Every plugin verb, by name.", "note": null, "noteFrom": null, "declaration": "pub fn verbs(&self) -> Vec<Arc<dyn Verb>>;", "display": "pub fn verbs(&self) -> Vec<Arc<dyn Verb>>;", "sections": [], "line": 336, "lastLine": 343, "tags": ["method", "public"], "mentions": ["plugin/Verb"]}, {"id": "plugin/TxCore::resources", "name": "resources", "title": "TxCore::resources", "kind": "method", "module": "plugin", "visibility": "public", "owner": "core/TxCore", "doc": ["Resources of active plugins whose name starts with `prefix`, in manifest order then name", "order."], "summary": "Resources of active plugins whose name starts with `prefix`, in manifest order then name order.", "note": "Named static blobs listed by prefix. The IDE plugin gathers every plugin's `keys/*.tmux` fragment this way; core stores `&'static [u8]` and never reads them. [[preview_verbs]] lists verbs without a core, for usage text that must not create the state dir.", "noteFrom": null, "declaration": "pub fn resources(&self, prefix: &str) -> Vec<Resource>;", "display": "pub fn resources(&self, prefix: &str) -> Vec<Resource>;", "sections": [], "line": 345, "lastLine": 354, "tags": ["method", "public"], "mentions": ["plugin/Resource"]}, {"id": "plugin/TxCore::plugin_status", "name": "plugin_status", "title": "TxCore::plugin_status", "kind": "method", "module": "plugin", "visibility": "public", "owner": "core/TxCore", "doc": ["Manifest order."], "summary": "Manifest order.", "note": null, "noteFrom": null, "declaration": "pub fn plugin_status(&self) -> &[(String, PluginStatus)];", "display": "pub fn plugin_status(&self) -> &[(String, PluginStatus)];", "sections": [], "line": 356, "lastLine": 359, "tags": ["method", "public"], "mentions": ["plugin/PluginStatus"]}, {"id": "config/CoreConfig::new", "name": "new", "title": "CoreConfig::new", "kind": "method", "module": "config", "visibility": "public", "owner": "config/CoreConfig", "doc": [], "summary": "", "note": null, "noteFrom": null, "declaration": "pub fn new(state_dir: impl Into<PathBuf>) -> Self;", "display": "pub fn new(state_dir: impl Into<PathBuf>) -> Self;", "sections": [], "line": 31, "lastLine": 39, "tags": ["method", "public"], "mentions": []}, {"id": "config/CoreConfig::tmux_socket", "name": "tmux_socket", "title": "CoreConfig::tmux_socket", "kind": "method", "module": "config", "visibility": "public", "owner": "config/CoreConfig", "doc": [], "summary": "", "note": null, "noteFrom": null, "declaration": "pub fn tmux_socket(mut self, socket: impl Into<PathBuf>) -> Self;", "display": "pub fn tmux_socket(\n    mut self,\n    socket: impl Into<PathBuf>,\n) -> Self;", "sections": [], "line": 41, "lastLine": 44, "tag {"source": "error", "target": "store"}, {"source": "error", "target": "tmux"}], "modules": [{"module": "core", "doc": "`TxCore`: the public operations. One struct, built once by `open`, owning its collaborators.", "imports": ["config", "engine", "error", "events", "locks", "messaging", "plugin", "profile", "session", "store", "tmux"], "hidden": false}, {"module": "config", "doc": "`CoreConfig`: everything the library needs, handed in by the caller. The library never reads the process environment.", "imports": ["error"], "hidden": false}, {"module": "session", "doc": "The session record: what core stores on disk for every managed session.", "imports": ["error"], "hidden": false}, {"module": "store", "doc": "`SessionStore`: `<dir>/<id>.json`, one file per record, written atomically (temp file in the same directory, then rename) so a reader never sees a half-written record.", "imports": ["session"], "hidden": true}, {"module": "locks", "doc": "Advisory file locks under `<state_dir>/locks/`: `create.lock` serializes name checks and `<id>.lock` serializes writes to (and keystrokes into) one session. `std::fs::File::lock`, no extra dependency. Lock order is always `create.lock` before `<id>.lock`.", "imports": ["session"], "hidden": true}, {"module": "tmux", "doc": "tx's own tmux server. Every call is `tmux -S <socket> -f <conf> …`, so the user's default server is never touched and `~/.tmux.conf` is never loaded. Sessions are addressed by exact name (`=name`) when created and by their `@tx-id` option afterwards: `list_live` is the only liveness signal and yields the `$N` / `%N` targets every other call uses.", "imports": ["session"], "hidden": true}, {"module": "events", "doc": "Events: what happened to one session. Every mutation produces [`Event`]s that go to the operation log (`<state_dir>/log.jsonl`, one compact JSON line `{\"ts\",\"actor\",\"type\",\"id\",\"name\",\"msg\"}` per event, appended with a single write on an `O_APPEND` descriptor so concurrent writers never tear a line) and then to every in-process [`EventSink`].", "imports": ["session"], "hidden": false}, {"module": "messaging", "doc": "Delivery of one message to one running session: the envelope is typed into the pane with `send-keys -l`, a pause lets the engine's input handling settle, then `Enter` submits it. A receipt means input was submitted: not read, not completed, not retried.", "imports": ["tmux"], "hidden": true}, {"module": "profile", "doc": "Profiles: a list of role names resolved against search dirs into one system-prompt text plus the skill directories the roles grant. `<dir>/<NAME>.md` from the last dir that has it is the base; every dir's `<NAME>.local.md` extends it, in dir order. A role file may open with a frontmatter block whose `skills: [a, b]` line (at any indent, so `tx:` nesting works) grants skills; each resolves to `<skill_dir>/<name>/` from the last skill dir that has it.", "imports": [], "hidden": false}, {"module": "engine", "doc": "Engines as plugins: one `EngineAdapter` per coding-agent CLI, each a pure function from a `LaunchRequest` to a `LaunchPlan`. Core applies the plan's workspace actions and starts the process, so an adapter is unit-testable without a filesystem or tmux.", "imports": ["error", "messaging", "profile", "session"], "hidden": false}, {"module": "plugin", "doc": "The plugin host. One trait, [`Plugin`]; a [`Registry`] with four slots (engines, event sinks, verbs, resources); a [`PluginConfig`] the front end fills from its own config format. Core never parses arguments or reads the environment: a [`Verb`] receives argv already split. A resource is a named static blob the core stores and lists but never reads.", "imports": ["config", "core", "engine", "error", "events"], "hidden": false}, {"module": "error", "doc": "The one error type every public operation returns.", "imports": ["config", "engine", "profile", "session", "store", "tmux"], "hidden": false}], "meta": {"ref": "poc @ 9b70814"}, "urls": {"core/SESSIONS_DIR" // ---------- graph rendering -----------------------------------------------------------------------
const svg = document.getElementById("svg"), viewport = document.getElementById("viewport"), tip = document.getElementById("tip");

function selectedRepresentative() {

// Embedded there are two levels: the module map, and one object with its relations ("focus").

function renderMap() {
  save();

  const selectedKey = selectedRepresentative();
  const selectedCard = state.selected && cards.get(state.selected);
  const selectedMethod = selectedCard && selectedCard.kind === "method" ? selectedCard : null;
  const neighbours = new Set();
  let html = "";
  for (const module of moduleNames) {
    const box = lay.modules.get(module);

// What an object uses and what uses it: item edges (as drawn on the map), or, for a method, its calls,

function focusModel(id) {

  if (card.kind === "method") {
    for (const edge of DATA.callEdges) {
      if (edge.source === id) add(uses, edge.target, { ...edge, kind: "calls", via: [] });
      if (edge.target === id) add(usedBy, edge.source, { ...edge, kind: "calls", via: [] });

    for (const edge of DATA.edges) {

// Focus: used-by on the left, the object in the middle, uses on the right, each grouped by module.

const FOCUS_BOX_W = PILL_W + 24, FOCUS_GAP = 18, FOCUS_COLUMN_GAP = 70, FOCUS_COLUMN_HEIGHT = 560;

      byModule.get(card.module).push(card);
    }
    const boxes = [...byModule].sort((a, b) => moduleNames.indexOf(a[0]) - moduleNames.indexOf(b[0]))
      .map(([module, list]) => ({ module, list, h: HEAD + list.length * (PILL_H + PILL_GAP) + 8 }));
    const total = boxes.reduce((sum, box) => sum + box.h + FOCUS_GAP, 0);

    const columns = [[]];
    let filled = 0;
    for (const box of boxes) {
      if (filled > 0 && filled + box.h / 2 > total / columnCount && columns.length < columnCount) { columns.push([]); filled = 0; }
      columns[columns.length - 1].push(box);
      filled += box.h + FOCUS_GAP;
    }
    columns.forEach((column, index) => {
      const x = FOCUS_START[side] + FOCUS_DIRECTION[side] * index * (FOCUS_BOX_W + FOCUS_COLUMN_GAP);
      let y = -(column.reduce((sum, box) => sum + box.h, 0) + FOCUS_GAP * (column.length - 1)) / 2;

// Focus edges always run sideways: from the right edge of the left pill to the left edge of the right

// The module map keeps its zoom and pan across pages; the focus graph is framed anew for each object.
const VIEW_KEY = "tx-structure-view-" + VIEW;

// pan & zoom
let drag = null;
let dragged = false;
svg.addEventListener("mousedown", (event) => { drag = { x: event.clientX, y: event.clientY, panX: state.panX, panY: state.panY, moved: false }; });

      if (visibleItems(module).length) { if (state.expanded.has(module)) state.expanded.delete(module); else state.expanded.add(module); }

// A link hovered in the rustdoc page: light the item if it is drawn; on the module map, fall back to its module.
function hoverPage(page) {

// ---------- panel ----------------------------------------------------------------------------------------
function depRows(edges, direction) {

function implBlock(card) {
  if (!card.sections.length || card.kind === "trait") return "";

  for (const section of card.sections) {
    if (section.label) html += `<div class="section">// ${escapeHtml(section.label)}</div>`;
    for (const id of section.methods) {
      const method = cards.get(id);
      const flag = hasWarning(method) ? ' <span style="color:var(--warn)">⚠ review</span>' : method.note ? ' <span style="color:var(--accent-2)">✎ note</span>' : "";
      html += `<div class="row${dimmed(method) ? " dim" : ""}"><div class="sig">${highlight(method.declaration, method)}</div>${method.summary || flag ? `<div class="what">${escapeHtml(method.summary)}${flag}</div>` : ""}</div>`;
    }
  }
  return html + `<div class="close">}</div></div>`;
}

function showCard(card) {
  const owner = card.owner ? cards.get(card.owner) : null;
  let siblings = "";
  if (owner) {
    const list = owner.sections.flatMap((section) => section.methods);
    const index = list.indexOf(card.id);
    siblings = `<span class="siblings">${list[index - 1] ? `<a data-id="${escapeHtml(list[index - 1])}">← ${escapeHtml(cards.get(list[index - 1]).name)}</a>` : ""}${list[index + 1] ? `<a data-id="${escapeHtml(list[index + 1])}">${escapeHtml(cards.get(list[index + 1]).name)} →</a>` : ""}</span>`;
  }
  const path = owner ? `${owner.name}::${card.name}` : isPublic(card) ? `tx_core::${card.name}` : `${card.module}::${card.name}`;
  const chips = [`<span class="chip">${card.kind}</span>`, `<span class="chip">${escapeHtml(path)}</span>`, `<span class="chip">${card.module}.rs:${card.line}</span>`];
  if (INTERNAL || !isPublic(card)) chips.push(`<span class="chip vis-${card.visibility === "module-path" ? "hidden" : card.visibility}">${VISIBILITY_LABEL[card.visibility]}</span>`);
  let html = EMBED ? "" : `<div class="crumbs"><span><a data-id="module/${card.module}">${card.module}.rs</a>${owner ? ` › <a data-id="${escapeHtml(owner.id)}">${escapeHtml(owner.name)}</a>` : ""}</span>${siblings}</div>
    <h1>${escapeHtml(card.name)}${!EMBED && DATA.urls[card.id] ? `<a class="docs-link" href="${DATA.urls[card.id]}">rustdoc ↗</a>` : ""}</h1><div class="chips">${chips.join("")}</div>
    <div class="summary">${card.summary ? inline(card.summary) : '<span class="none">no doc comment</span>'}</div>`;
  if (!EMBED && card.note) html += noteHtml(card.note, card.noteFrom);
  if (!EMBED) html += `<pre class="decl">${highlight(card.display || card.declaration)}</pre>` + implBlock(card);
  if (EMBED) return;
  const relation = (title, list, direction) => list.length ? `<h2>${title}</h2>${depRows(list, direction)}` : "";
  if (card.kind === "method" && INTERNAL) {
    const calls = DATA.callEdges.filter((e) => e.source === card.id).map((e) => cards.get(e.target));
    const callers = DATA.callEdges.filter((e) => e.target === card.id).map((e) => cards.get(e.source));
    const callList = (title, list) => `<h2>${title}</h2>${list.length ? `<div class="dep">${list.map((c) => `<div class="to"><a class="ref" data-id="${escapeHtml(c.id)}">${escapeHtml(c.title)}</a></div><div class="via">${escapeHtml(VISIBILITY_LABEL[c.visibility])}</div>`).join("")}</div>` : '<div class="none">none</div>'}`;
    html += callList("Calls →", calls) + callList("Called by ←", callers);
  }
  if (card.kind === "method") {
    html += `<h2>Types in this signature</h2>${card.mentions.length ? `<div class="dep">${card.mentions.map((id) => `<div class="to"><a class="ref" data-id="${escapeHtml(id)}">${escapeHtml(cards.get(id).name)}</a></div><div class="via">${escapeHtml(cards.get(id).summary || "")}</div>`).join("")}</div>` : '<div class="none">none</div>'}`;
  } else {
    const out = DATA.edges.filter((e) => e.source === card.id), inc = DATA.edges.filter((e) => e.target === card.id);
    const of = (list, kind) => list.filter((e) => e.kind === kind);
    const block = relation("Holds (fields, variants) →", of(out, "has"), "out") + relation("Calls into →", of(out, "calls"), "out")
      + relation("Mentions in signatures →", of(out, "uses"), "out") + relation("Held by ←", of(inc, "has"), "in")
      + relation("Called by ←", of(inc, "calls"), "in") + relation("Mentioned by ←", of(inc, "uses"), "in");
    html += block || '<h2>Relations</h2><div class="none">none</div>';
  }
  const fullDoc = card.doc.join("\n").trim();
  if (!EMBED && fullDoc && fullDoc.replace(/\s+/g, " ") !== card.summary) html += `<h2>Doc comment</h2><div class="prose">${fullDoc.split(/\n\s*\n/).map((p) => `<p>${inline(p.replace(/\n/g, " "))}</p>`).join("")}</div>`;
  document.getElementById("card").innerHTML = html;
}

function showModule(module) {
  const info = DATA.modules.find((m) => m.module === module);
  const items = DATA.cards.filter((c) => c.kind !== "method" && c.module === module);
  const importsOut = info.imports.filter((m) => m !== "lib"), importsIn = DATA.modules.filter((m) => m.imports.includes(module)).map((m) => m.module);
  const usesOut = new Map(), usesIn = new Map();
  for (const edge of DATA.edges) {
    const s = cards.get(edge.source).module, t = cards.get(edge.target).module;
    if (s === t) continue;
    if (s === module) usesOut.set(t, (usesOut.get(t) || 0) + 1);
    if (t === module) usesIn.set(s, (usesIn.get(s) || 0) + 1);
  }
  const moduleList = (names, counts) => names.length ? `<div class="dep">${names.map((m) => `<div class="to"><a data-id="module/${m}">${m}.rs</a></div><div class="via">${counts.get(m) ? `${counts.get(m)} interface link${counts.get(m) > 1 ? "s" : ""}` : "import only"}</div>`).join("")}</div>` : '<div class="none">none</div>';
  const moduleUrl = DATA.urls["module/" + module];
  let html = EMBED ? "" : `<div class="crumbs"><span>module</span></div><h1>${module}.rs${moduleUrl ? `<a class="docs-link" ${EMBED ? `data-id="module/${module}"` : `href="${moduleUrl}"`}>rustdoc ↗</a>` : ""}</h1><div class="chips"><span class="chip">${MODULE_ROLE[module]}</span><span class="chip">poc/tx-core/src/${module}.rs</span></div>
    <div class="summary">${info.doc ? inline(info.doc) : ""}</div>`;
  if (!EMBED) html += `<h2>${INTERNAL ? "Items" : "Interfaces"} · ${items.length}</h2>${items.length ? `<div class="mod-items">${items.map((c) => `<div><span class="badge b-${c.kind}" style="display:inline-block;margin-right:6px">${c.kind[0].toUpperCase()}</span><a class="ref" data-id="${escapeHtml(c.id)}" style="${dimmed(c) ? "color:#8d8d8d;font-style:italic" : ""}">${escapeHtml(c.name)}</a></div>`).join("")}</div>` : '<div class="none">nothing public — internal module</div>'}`;
  html += `<h2>Imports (use crate::…) →</h2>${moduleList(importsOut, usesOut)}`;
  html += `<h2>Imported by ←</h2>${moduleList(importsIn, usesIn)}`;
  document.getElementById("card").innerHTML = html;
}

function showEdge(edge) {
  if (edge.kind === "import") { select("module/" + edge.a.module); return; }
  const rows = edge.edges.map((e) => {
    const source = cards.get(e.source), target = cards.get(e.target);
    const vias = e.via.map((via) => { const method = viaMethod(e.source, via); return method ? `<a data-id="${escapeHtml(method.id)}">${escapeHtml(via.label)}</a>` : escapeHtml(via.label); }).join(", ");
    return `<div class="to"><a class="ref" data-id="${escapeHtml(source.id)}">${escapeHtml(source.name)}</a> → <a class="ref" data-id="${escapeHtml(target.id)}">${escapeHtml(target.name)}</a></div><div class="via">${vias}</div>`;
  }).join("");
  document.getElementById("card").innerHTML = `<div class="crumbs"><span>dependency</span></div><h1 style="font-size:17px">${escapeHtml(nameOfKey(edge.a.key))} → ${escapeHtml(nameOfKey(edge.b.key))}</h1>
    <div class="summary">${edge.edges.length} interface link${edge.edges.length > 1 ? "s" : ""}. Each row says which declaration line or public method carries the reference.</div><div class="dep">${rows}</div>`;
}

const indexOpen = new Set(["core/TxCore"]);
let indexFilter = "";
function buildIndex(filter = indexFilter) {
  indexFilter = filter;

  const match = (card) => !query || card.title.toLowerCase().includes(query) || (card.summary || "").toLowerCase().includes(query);
  let html = "";
  for (const group of DATA.groups) {
    let body = "";
    for (const id of group.ids) {
      const card = cards.get(id);
      const count = card.sections.reduce((sum, section) => sum + section.methods.length, 0);
      const open = count && (indexOpen.has(id) || (query && card.sections.some((s) => s.methods.some((m) => match(cards.get(m))))));
      const methodRows = open ? card.sections.map((section) => {
        const rows = section.methods.map((mid) => cards.get(mid)).filter((method) => match(method) || match(card));
        return rows.length ? `<div class="sub-label">${escapeHtml(section.label)}</div>` + rows.map((method) =>
          `<div class="entry sub${dimmed(method) ? " modpath" : ""}" data-id="${escapeHtml(method.id)}" title="${escapeHtml(VISIBILITY_LABEL[method.visibility])}">${escapeHtml(method.name)}${hasWarning(method) ? '<span class="flag">⚠</span>' : ""}</div>`).join("") : "";
      }).join("") : "";
      if (!match(card) && !methodRows) continue;
      if (!query && (INTERNAL ? card.kind === "const" && !state.showConsts : !isPublic(card) && !state.showModulePath)) continue;
      const caret = count ? `<span class="caret" data-caret="${escapeHtml(id)}" title="${count} methods">${open ? "▾" : "▸"}</span>` : '<span class="caret"></span>';
      body += `<div class="entry${dimmed(card) ? " modpath" : ""}" data-id="${escapeHtml(card.id)}" title="${escapeHtml(VISIBILITY_LABEL[card.visibility])}">${caret}<span class="badge b-${card.kind}">${card.kind[0].toUpperCase()}</span>${escapeHtml(card.title)}${count ? `<span class="count">${count}</span>` : ""}${hasWarning(card) ? '<span class="flag">⚠</span>' : ""}</div>${methodRows}`;
    }

    html += `<div class="group"><div class="group-label" data-id="module/${group.module}"><span class="mdot" style="background:${color}"></span>${escapeHtml(group.label)}</div>${body || '<div class="entry empty-mod">internal only — nothing public</div>'}</div>`;
  }
  document.getElementById("list").innerHTML = html || '<div class="none" style="padding:8px">no matches</div>';
  const current = decodeURIComponent(location.hash.slice(2));

// quick switcher
const switcher = document.getElementById("switcher"), switchInput = document.getElementById("switch-input"), switchResults = document.getElementById("switch-results");
const switchTargets = DATA.cards.map((card) => ({ id: card.id, title: card.title, kind: card.kind, summary: card.summary }))
  .concat(DATA.modules.map((m) => ({ id: "module/" + m.module, title: m.module + ".rs", kind: "module", summary: MODULE_ROLE[m.module] })));
let switchSelection = 0, switchMatches = [];
function fuzzy(query, text) {
  let position = 0, score = 0;
  for (const char of query) { const found = text.indexOf(char, position); if (found < 0) return -1; score += found - position; position = found + 1; }
  return score + (text.startsWith(query) ? -5 : 0) + text.length * 0.01;
}
function updateSwitcher() {
  const query = switchInput.value.trim().toLowerCase();
  switchMatches = switchTargets.map((target) => ({ target, score: query ? fuzzy(query, target.title.toLowerCase()) : (order.indexOf(target.id) + 1 || 999) }))
    .filter((entry) => entry.score >= 0).sort((a, b) => a.score - b.score).slice(0, 40).map((entry) => entry.target);
  switchSelection = Math.min(switchSelection, Math.max(0, switchMatches.length - 1));
  switchResults.innerHTML = switchMatches.map((target, index) => `<div class="r${index === switchSelection ? " sel" : ""}" data-index="${index}"><span class="badge b-${target.kind}" style="${target.kind === "module" ? "background:#666" : ""}">${target.kind === "module" ? "M" : target.kind[0].toUpperCase()}</span><span class="n">${escapeHtml(target.title)}</span><span class="s">${escapeHtml(target.summary || "")}</span></div>`).join("");
  switchResults.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
}
function openSwitcher() { switcher.classList.add("open"); switchInput.value = ""; switchSelection = 0; updateSwitcher(); switchInput.focus(); }

  if (event.key === "ArrowDown") { switchSelection = Math.min(switchSelection + 1, switchMatches.length - 1); updateSwitcher(); event.preventDefault(); }
  if (event.key === "ArrowUp") { switchSelection = Math.max(switchSelection - 1, 0); updateSwitcher(); event.preventDefault(); }
  if (event.key === "Enter" && switchMatches[switchSelection]) { closeSwitcher(); select(switchMatches[switchSelection].id); }
  if (event.key === "Escape") closeSwitcher();
});

function step(delta) {
  const index = order.indexOf(state.selected);
  select(order[Math.max(0, Math.min(order.length - 1, (index < 0 ? -1 : index) + delta))]);
}
document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openSwitcher(); return; }
  if (event.target.tagName === "INPUT") return;
  if (event.key === "/") { event.preventDefault(); filter.focus(); }
  else if (event.key === "j" || event.key === "ArrowDown") { event.preventDefault(); step(1); }
  else if (event.key === "k" || event.key === "ArrowUp") { event.preventDefault(); step(-1); }
  else if (event.key === "[") history.back();
  else if (event.key === "]") history.forward();
  else if (event.key === "f") fit();
  else if (event.key === "u") { const card = cards.get(state.selected); if (card && card.owner) select(card.owner); else if (card) select("module/" + card.module); }
  else if (event.key === "e") {
    const card = cards.get(state.selected);
    const module = card ? card.module : state.selected && state.selected.startsWith("module/") ? state.selected.slice(7) : null;
    if (module) { if (state.expanded.has(module)) state.expanded.delete(module); else state.expanded.add(module); render(); }
  }
});
window.addEventListener("popstate", () => { const id = decodeURIComponent(location.hash.slice(2)); if (id) select(id, false); });

buildIndex();
render();
fit();
if (EMBED) {
  focusPage(PARAMS.get("page") || "");
} else {
  const initial = decodeURIComponent(location.hash.slice(2));
  select(initial || "core/TxCore", false);
  fit();
}
</script>
</body>
</html>
