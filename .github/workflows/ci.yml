name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  test:
    name: test
    # tx targets macOS only for now.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests that need a tool skip themselves when it is missing; install every one they check.
      # zsh, git, python3 and jq come with the runner image.
      - name: Install tmux, fzf, Neovim
        run: brew install tmux fzf neovim
      - name: Tool versions
        run: |
          rustc --version
          tmux -V
          fzf --version
          zsh --version
          nvim --version | head -n 1
      - run: cargo test --workspace --locked
