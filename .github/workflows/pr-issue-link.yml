name: pr-issue-link

# Every PR into develop or main must reference an existing issue in this repository
# with a closing keyword (Closes/Fixes/Resolves #N) or Refs #N for partial work.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop, main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const thisRepository = `${owner}/${repo}`.toLowerCase();

            // The PR body is untrusted input: it is read from the event payload,
            // never interpolated into the workflow. HTML comments are dropped so the
            // template's guidance text cannot satisfy the check.
            const body = (context.payload.pull_request.body ?? '').replace(/<!--[\s\S]*?-->/g, '');

            const referencePattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\b:?\s*(?:https:\/\/github\.com\/([\w.-]+\/[\w.-]+)\/issues\/(\d+)|([\w.-]+\/[\w.-]+)?#(\d+))\b/gi;

            const numbers = new Set();
            const foreign = [];
            for (const match of body.matchAll(referencePattern)) {
              const repository = match[1] ?? match[3];
              const number = Number(match[2] ?? match[4]);
              if (repository === undefined || repository.toLowerCase() === thisRepository) {
                numbers.add(number);
              } else {
                foreign.push(`${repository}#${number}`);
              }
            }

            const issues = [];
            const rejected = [];
            for (const number of numbers) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (data.pull_request) {
                  rejected.push(`#${number} is a pull request, not an issue`);
                } else {
                  issues.push(`#${number}`);
                }
              } catch (error) {
                if (error.status !== 404 && error.status !== 410) throw error;
                rejected.push(`#${number} does not exist in ${owner}/${repo}`);
              }
            }

            for (const line of rejected) core.warning(line);
            for (const reference of foreign) core.warning(`${reference} is in another repository and does not count`);

            if (issues.length === 0) {
              core.setFailed(
                `This PR does not reference an existing issue in ${owner}/${repo}.\n` +
                'Add a line to the PR description such as:\n' +
                '  Closes #123   (this PR completes the issue)\n' +
                '  Refs #123     (partial work; the issue stays open)\n' +
                'Fixes/Resolves and full issue URLs work too. Open an issue first if none exists.'
              );
              return;
            }
            core.info(`Linked issue(s): ${issues.join(', ')}`);
