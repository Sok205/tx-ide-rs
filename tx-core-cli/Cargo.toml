[package]
name = "tx-core-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "tx: a thin command-line surface over tx-core."
default-run = "tx"

[[bin]]
name = "tx"
path = "src/main.rs"

# Internal entry point run by machines (the hooks an engine wires), never listed in `tx help`.
[[bin]]
name = "txi"
path = "src/txi.rs"

[dependencies]
shlex = "2"
tx-core.workspace = true
tx-client.workspace = true
tx-plugin.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]

[lints]
workspace = true

[features]
# Heavy property/fuzz suites (many cases, real tmux servers): `cargo test --workspace --features fuzz`.
fuzz = []

[[test]]
name = "fuzz_cli"
required-features = ["fuzz"]
