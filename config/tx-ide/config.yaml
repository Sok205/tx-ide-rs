# tx configuration: ~/.config/tx-ide/config.yaml (`tx help` prints the path in use).
# Written by `install` with every default spelled out; edit any value. `install` never overwrites
# this file, so a newer default reaches you only if you copy it from config/tx-ide/config.yaml in
# the repository. A key you delete falls back to the same default.

# Defaults for `tx create`; a flag given on the command line replaces its key.
agent:
  engine: claude               # claude | codex
  roles: []                    # empty: the definition's own `roles`; any --role replaces the whole list
  definition: developer        # the agent definition without --agent (its prompt, tools, skills and roles); null: roles alone
  model: claude-opus-5-5       # Opus 5.5; null: the engine's own default (for claude, settings.json)
  effort: 3                    # 1-5: low|medium|high|xhigh|max, or the engine's word (codex also none|minimal); null: the engine's own

# The agents' git worktrees (<data>/worktrees).
worktree:
  # Paths in a worktree that are safe to delete: `tx gc` removes them once its agents have ended,
  # and a respawned agent rebuilds them. Relative to the worktree; no `..`, nothing git tracks.
  # A Node project would add node_modules and dist.
  build_outputs: [target]

# Every plugin, on. `enabled: false` switches one off; `tx plugins` shows the result.
plugins:
  engine-claude: { enabled: true }
  engine-codex: { enabled: true }
  chat: { enabled: true }
  ide: { enabled: true }
  labels: { enabled: true }
  kill: { enabled: true }
  picker: { enabled: true }
  edit: { enabled: true }
  spawn: { enabled: true }
  assistant:
    enabled: true
    settings: { model: opus, effort: 2 }        # what the tx-assistant (prefix+/) runs on
  mockup: { enabled: true }
  tutor: { enabled: true }
  artifacts:
    enabled: true
    settings: { editor: nvim }                   # the program an artifact's view runs
  tour: { enabled: true }
  timeline: { enabled: true }
  graph: { enabled: true }
  home: { enabled: true }
  home-themes:
    enabled: true
    settings: { theme: koi }                     # the home's animation; `b` in the home picks another
  layouts: { enabled: true }
