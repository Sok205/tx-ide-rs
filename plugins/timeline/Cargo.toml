[package]
name = "tx-timeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "tx-core plugin: swimlanes of session activity in the terminal (ratatui), prefix+T."

# The plugin as its own program: what `plugin.yaml` names for its verbs.
[[bin]]
name = "tx-timeline"
path = "src/main.rs"

[dependencies]
tx-core.workspace = true
tx-client.workspace = true
tx-plugin.workspace = true
tx-chat = { path = "../chat" }
serde_json.workspace = true
ratatui = "0.30"
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
