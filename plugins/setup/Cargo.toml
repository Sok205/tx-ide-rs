[package]
name = "tx-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "tx plugin: the installer's wizard and the presets; chooses which shipped plugins are installed."

# The plugin's program: what `plugin.yaml` names for `tx setup`. It opens no core.
[[bin]]
name = "tx-setup"
path = "src/main.rs"

[dependencies]
tx-core.workspace = true
tx-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
ratatui = "0.30"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
