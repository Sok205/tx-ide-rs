<!-- Injected into every rustdoc page (--html-after-content): the Structure drawer, a square frame
     docked top-right that loads structure.html for the page being read. -->
<div id="tx-structure" class="tx-structure-closed">
  <button id="tx-structure-tab" title="Structure graph (g)">Structure</button>
  <div id="tx-structure-resize"></div>
  <iframe id="tx-structure-frame" title="tx-core structure"></iframe>
</div>
<style>
/* An overlay: the docs keep their full width underneath. */
#tx-structure { position: fixed; top: 12px; right: 12px; width: var(--tx-structure-width, 40vw); height: min(var(--tx-structure-width, 40vw), calc(100vh - 24px)); z-index: 100; background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.22); }
#tx-structure iframe { border-radius: 6px; }
#tx-structure iframe { width: 100%; height: 100%; border: 0; display: block; }
#tx-structure.tx-structure-closed { width: 0; border: 0; box-shadow: none; right: 0; }
#tx-structure.tx-structure-closed iframe, #tx-structure.tx-structure-closed #tx-structure-resize { display: none; }
#tx-structure-tab { position: absolute; top: 120px; right: 100%; transform-origin: right bottom; transform: rotate(-90deg) translateY(0); white-space: nowrap; background: var(--sidebar-background-color); color: var(--main-color); border: 1px solid var(--border-color); border-bottom: 0; border-radius: 4px 4px 0 0; padding: 3px 12px; font: 500 14px "Fira Sans", Arial, NanumBarunGothic, sans-serif; cursor: pointer; }
#tx-structure-tab:hover { background: var(--sidebar-background-color-hover); }
#tx-structure-resize { position: absolute; top: 0; bottom: 0; left: -3px; width: 6px; cursor: col-resize; }
body.tx-structure-resizing iframe { pointer-events: none; }
</style>
<script>
(() => {
  const root = document.querySelector('meta[name="rustdoc-vars"]').dataset.rootPath;
  const rootPath = new URL(root, location.href).pathname;
  const drawer = document.getElementById("tx-structure");
  const frame = document.getElementById("tx-structure-frame");
  const page = () => decodeURIComponent(location.pathname.slice(rootPath.length)) + location.hash;
  const width = localStorage.getItem("tx-structure-width");
  if (width) document.documentElement.style.setProperty("--tx-structure-width", width);

  function setOpen(open) {
    drawer.classList.toggle("tx-structure-closed", !open);
    localStorage.setItem("tx-structure-open", open ? "1" : "0");
    if (open && !frame.src) frame.src = `${root}structure.html?page=${encodeURIComponent(page())}`;
  }
  setOpen(localStorage.getItem("tx-structure-open") !== "0");
  document.getElementById("tx-structure-tab").onclick = () => setOpen(drawer.classList.contains("tx-structure-closed"));
  document.addEventListener("keydown", (event) => {
    if (event.key !== "g" || event.metaKey || event.ctrlKey || event.altKey || event.target.closest("input, textarea")) return;
    setOpen(drawer.classList.contains("tx-structure-closed"));
  });

  // The graph asks for navigation; rustdoc tells the graph which item is on screen.
  window.addEventListener("message", (event) => {
    if (event.source === frame.contentWindow && event.data.type === "tx-open") location.href = root + event.data.url;
  });
  // The drawer wears the page's theme: send rustdoc's resolved variables now and on every theme change.
  const THEME_VARIABLES = ["--main-background-color", "--main-color", "--sidebar-background-color",
    "--sidebar-background-color-hover", "--border-color", "--headings-border-bottom-color", "--code-block-background-color",
    "--button-background-color", "--right-side-color", "--link-color", "--mod-link-color", "--type-link-color",
    "--trait-link-color", "--function-link-color", "--target-background-color", "--target-border-color",
    "--warning-border-color", "--search-input-focused-border-color", "--scrollbar-track-background-color",
    "--scrollbar-thumb-background-color"];
  function sendTheme() {
    const style = getComputedStyle(document.documentElement);
    const variables = Object.fromEntries(THEME_VARIABLES.map((name) => [name, style.getPropertyValue(name).trim()]));
    frame.contentWindow.postMessage({ type: "tx-theme", variables }, "*");
  }
  frame.addEventListener("load", sendTheme);
  new MutationObserver(sendTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  // Hovering a link to a documented item in the page lights that item's connections in the graph.
  let hoveredPage = null;
  document.addEventListener("mouseover", (event) => {
    const link = event.target.closest("a[href]");
    let target = null;
    if (link && !link.closest("#tx-structure")) {
      const url = new URL(link.href, location.href);
      if (url.pathname.startsWith(rootPath)) target = decodeURIComponent(url.pathname.slice(rootPath.length)) + url.hash;
    }
    if (target === hoveredPage) return;
    hoveredPage = target;
    frame.contentWindow.postMessage({ type: "tx-hover", page: target }, "*");
  });
  window.addEventListener("hashchange", () => frame.contentWindow && frame.contentWindow.postMessage({ type: "tx-page", page: page() }, "*"));

  document.getElementById("tx-structure-resize").addEventListener("mousedown", (event) => {
    event.preventDefault();
    document.body.classList.add("tx-structure-resizing");
    const move = (moveEvent) => {
      const value = Math.max(320, Math.min(innerWidth - 360, innerWidth - 12 - moveEvent.clientX)) + "px";
      document.documentElement.style.setProperty("--tx-structure-width", value);
      localStorage.setItem("tx-structure-width", value);
    };
    const up = () => { document.body.classList.remove("tx-structure-resizing"); removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
    addEventListener("mousemove", move);
    addEventListener("mouseup", up);
  });
})();
</script>
