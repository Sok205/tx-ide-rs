[package]
name = "tx-core-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "txc: a thin command-line surface over tx-core."

[[bin]]
name = "txc"
path = "src/main.rs"

[dependencies]
tx-core.workspace = true
tx-engine-claude = { path = "../plugins/engine-claude" }
tx-engine-codex = { path = "../plugins/engine-codex" }
tx-hooks = { path = "../plugins/hooks" }
tx-views = { path = "../plugins/views" }
tx-labels = { path = "../plugins/labels" }
tx-kill = { path = "../plugins/kill" }
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
