[workspace]
resolver = "3"
members = ["tx-core", "plugins/engine-claude", "plugins/engine-codex", "plugins/hooks", "plugins/ide", "plugins/labels", "plugins/kill", "plugins/picker", "plugins/edit", "plugins/spawn", "plugins/assistant", "tx-ui", "tx-core-cli"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
tx-core = { path = "tx-core" }
tx-ui = { path = "tx-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
