# tx-ide DEFAULT ~/.tmux.conf. The installer copies this into place when you
# have no ~/.tmux.conf (or, with a [y/N] confirm, when replacing an existing
# one — backed up first). It ends with the marked `source-file` block that
# loads the tx-ide view; keep that block if you edit this file.
#
# Layered over tx-ide: this file owns the things tx-ide doesn't (prefix C-a,
# vi copy-mode, status bar, splits-with-cwd, hjkl resize, prefix+R views toggle,
# TPM + resurrect + continuum). tx-ide owns prefix+t (tx), prefix+/
# (tx-assistant), M-1..9 / User0..8 quick-switch, C-u/C-d Claude scroll
# intercept, C-h/j/k/l seamless nav (nvim splits ↔ panes ↔ nested sessions),
# pane borders, tokyonight palette.

# === Prefix ===
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# === General ===
set -g history-limit 50000
set -g mouse on
set -g escape-time 10                  # less input lag in nvim
set -g repeat-time 2000                # window for -r repeats (default 500ms)
set -g focus-events on                 # nvim autoread
set -gq allow-passthrough on           # iTerm imgproto, OSC52
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"    # truecolor

# === Window/pane indexing ===
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === Vi-style copy mode ===
setw -g mode-keys vi
# Two paths to the system clipboard, neither relying on iTerm2's OSC52
# handling (denied by default):
#  - local copy-mode yanks (mouse drag, y, Enter) pipe to pbcopy via
#    copy-command;
#  - OSC52 arriving from panes — a VPS tmux over ssh, codex, nvim — is
#    accepted (set-clipboard on) and funneled to pbcopy by the hook.
# On a host without pbcopy (a Linux VPS) the if-shell block is skipped: copies
# land in a tmux buffer and set-clipboard emits OSC52 to the client, which the
# tmux on the Mac then catches. terminal-features guarantees the Ms capability
# even when the client's terminfo entry lacks it.
set -s set-clipboard on
set -as terminal-features ',*:clipboard'
if-shell 'command -v pbcopy' {
  set -s copy-command 'pbcopy'
  set-hook -g pane-set-clipboard 'run-shell "tmux save-buffer - | pbcopy"'
}
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# === Status bar ===
# Hidden globally. tx-ide flips `status on` per-session for @tx_view-marked view sessions
# (set up by `tx start` and `tx spawn-view`). Colors mirror tx-ide's palette
# (shared/palette.sh, tokyonight-night) — keep in sync.
set -g status off
set -g status-interval 1
set -g status-justify left

set -g status-style "fg=#a9b1d6,bg=#3b4261"
set -g status-left-length 0
set -g status-left ""
set -g status-right-length 80
set -g status-right "#[fg=#a9b1d6,bg=#3b4261]#(tmux-system-resources)  %H:%M:%S  #S "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#a9b1d6,bold"
setw -g window-status-current-style "fg=#7aa2f7,bold"

# No inline notifications in the status bar.
setw -g monitor-bell off
setw -g monitor-activity off
set -g bell-action none
set -g activity-action none

# === Titles pinned to tmux session/window names ===
set -g set-titles on
set -g set-titles-string '#S'
set -g allow-rename off
setw -g automatic-rename off

# === Unbind layout cycling (would break custom pane splits) ===
unbind Space

# === Pane splits inherit cwd ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# === Pane resize (vim-style, repeatable within repeat-time) ===
# Overrides prefix+l (last-window) — use prefix+n/p or prefix+w instead.
bind -r h resize-pane -L 15
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 15

set -g display-panes-time 1500

# === Ctrl+Tab / Ctrl+Shift+Tab window cycling ===
# Requires a terminal that actually transmits Ctrl+Tab. iTerm2 eats it by
# default (Next/Previous Tab): remove those shortcuts under Settings > Keys >
# Key Bindings, then either rely on CSI u reporting ("Apps can change how keys
# are reported") or add profile key mappings sending the sequences explicitly:
#   Ctrl+Tab       -> Send Escape Sequence: [9;5u
#   Ctrl+Shift+Tab -> Send Escape Sequence: [9;6u
# extended-keys lets tmux decode CSI 9;5u / 9;6u into C-Tab / C-S-Tab.
set -s extended-keys on
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# === Views-Left / Views-Right toggle with -Remote counterpart ===
bind R run-shell '~/.local/bin/tmux-views-toggle-remote'

# === TPM (Tmux Plugin Manager) ===
# Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then prefix + I to install plugins; prefix + U to update.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

if-shell "test -d ~/.tmux/plugins/tpm" "run '~/.tmux/plugins/tpm/tpm'"

# === BEGIN tx-ide ===
source-file ~/.tx-ide/tmux.conf
# === END tx-ide ===
