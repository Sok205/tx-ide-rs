function renderMap() {
  save();
  state.layout = layout();
  const lay = state.layout;
  currentEdges = edgeModel(lay);
  route(currentEdges);
  const selectedKey = selectedRepresentative();
  const selectedCard = state.selected && cards.get(state.selected);
  const selectedMethod = selectedCard && selectedCard.kind === "method" ? selectedCard : null;
  const neighbours = new Set();
  let html = "";
  for (const module of moduleNames) {
    const box = lay.modules.get(module);
    const color = MODULE_COLORS[module];
    const count = visibleItems(module).length;
    const canExpand = count > 0;
    const isSel = selectedKey === "module/" + module;
    html += moduleSvg(module, box, `${box.expanded ? "" : " collapsed"}${isSel ? " sel" : ""}`,
      canExpand ? `${count} ${INTERNAL ? "item" : "interface"}${count > 1 ? "s" : ""}` : "internal only", canExpand);
  }
  let edgesHtml = "";
  currentEdges.forEach((edge, index) => {
    const hot = selectedKey && (edge.a.key === selectedKey || edge.b.key === selectedKey);
    if (hot) { neighbours.add(edge.a.key); neighbours.add(edge.b.key); }
    const viaHot = selectedMethod && edge.edges.some((e) => e.source === selectedMethod.owner && e.via.some((v) => (v.method === selectedMethod.id) || v.label === "fn " + selectedMethod.name));
    if (edge.intra && !hot) return;
    edgesHtml += edgeSvg(edge, index, hot, viaHot, true);
  });
  let itemsHtml = "";
  for (const [id, pill] of lay.items) itemsHtml += pillSvg(id, pill, `${id === selectedKey ? " sel" : ""}${neighbours.has(id) && id !== selectedKey ? " nb" : ""}`);
  viewport.innerHTML = html + edgesHtml + itemsHtml;
  hovered = null;
  svg.classList.remove("hovering");
  svg.classList.toggle("focused", Boolean(selectedKey));
  for (const module of moduleNames) if (neighbours.has("module/" + module) && selectedKey !== "module/" + module) viewport.querySelector(`.mod[data-module="${module}"] .mod-box`).style.stroke = MODULE_COLORS[module];
  applyTransform();
}

// What an object uses and what uses it: item edges (as drawn on the map), or, for a method, its calls,
// callers and signature types.
function focusModel(id) {
  const card = cards.get(id);
  const uses = new Map(), usedBy = new Map();
  const add = (links, other, edge) => { if (!links.has(other)) links.set(other, []); links.get(other).push(edge); };
  if (card.kind === "method") {
    for (const edge of DATA.callEdges) {
      if (edge.source === id) add(uses, edge.target, { ...edge, kind: "calls", via: [] });
      if (edge.target === id) add(usedBy, edge.source, { ...edge, kind: "calls", via: [] });
    }
    for (const other of card.mentions) add(uses, other, { source: id, target: other, kind: "uses", via: [] });
  } else {
    for (const edge of DATA.edges) {
      if (!edgeShown(edge)) continue;
      if (edge.source === id) add(uses, edge.target, edge);
      if (edge.target === id) add(usedBy, edge.source, edge);
    }
  }
  return { card, uses, usedBy };
}

// Focus: used-by on the left, the object in the middle, uses on the right, each grouped by module.
// A side taller than FOCUS_COLUMN_HEIGHT wraps into more columns, moving outward, so the graph stays roughly square.
const FOCUS_BOX_W = PILL_W + 24, FOCUS_GAP = 18, FOCUS_COLUMN_GAP = 70, FOCUS_COLUMN_HEIGHT = 560;
const FOCUS_START = { usedBy: -FOCUS_BOX_W / 2 - 150 - FOCUS_BOX_W, center: -FOCUS_BOX_W / 2, uses: FOCUS_BOX_W / 2 + 150 };
const FOCUS_DIRECTION = { usedBy: -1, center: 0, uses: 1 };
function renderFocus() {
  save();
  const model = focusModel(state.focusId);
  const center = model.card;
  const modules = new Map(), items = new Map();
  const column = (ids, side) => {
    const byModule = new Map();
    for (const id of ids) {
      const card = cards.get(id);
      if (!byModule.has(card.module)) byModule.set(card.module, []);
      byModule.get(card.module).push(card);
    }
    const boxes = [...byModule].sort((a, b) => moduleNames.indexOf(a[0]) - moduleNames.indexOf(b[0]))
      .map(([module, list]) => ({ module, list, h: HEAD + list.length * (PILL_H + PILL_GAP) + 8 }));
    const total = boxes.reduce((sum, box) => sum + box.h + FOCUS_GAP, 0);
    const columnCount = Math.max(1, Math.ceil(total / FOCUS_COLUMN_HEIGHT));
    const columns = [[]];
    let filled = 0;
    for (const box of boxes) {
      if (filled > 0 && filled + box.h / 2 > total / columnCount && columns.length < columnCount) { columns.push([]); filled = 0; }
      columns[columns.length - 1].push(box);
      filled += box.h + FOCUS_GAP;
    }
    columns.forEach((column, index) => {
      const x = FOCUS_START[side] + FOCUS_DIRECTION[side] * index * (FOCUS_BOX_W + FOCUS_COLUMN_GAP);
      let y = -(column.reduce((sum, box) => sum + box.h, 0) + FOCUS_GAP * (column.length - 1)) / 2;
      for (const { module, list, h } of column) {
        const box = { module, x, y, w: FOCUS_BOX_W, h, expanded: true, count: list.length };
        modules.set(side + "/" + modules.size + "/" + module, box);
        list.sort((a, b) => pillLabel(a).localeCompare(pillLabel(b))).forEach((card, row) =>
          items.set(card.id, { card, x: box.x + 12, y: y + HEAD + row * (PILL_H + PILL_GAP), w: PILL_W, h: PILL_H }));
        y += h + FOCUS_GAP;
      }
    });
  };
  column([center.id], "center");
  column([...model.usedBy.keys()].filter((id) => !model.uses.has(id)), "usedBy");
  column([...model.uses.keys()], "uses");
  state.layout = { modules, items };
  const endpoint = (id) => ({ key: id, box: items.get(id), module: cards.get(id).module });
  const link = (source, target, edges) => ({ key: source + ">" + target, a: endpoint(source), b: endpoint(target), edges, kinds: new Set(edges.map((edge) => edge.kind)), kind: "item" });
  currentEdges = [...[...model.uses].map(([other, edges]) => link(center.id, other, edges)),
                  ...[...model.usedBy].map(([other, edges]) => link(other, center.id, edges))];
  focusRoute(currentEdges, center.id);
  let html = "";
  for (const box of modules.values()) html += moduleSvg(box.module, box, "", `${box.count} ${box.count > 1 ? "items" : "item"}`, false);
  currentEdges.forEach((edge, index) => { html += edgeSvg(edge, index, true, false, false); });
  for (const [id, pill] of items) html += pillSvg(id, pill, id === center.id ? " sel" : " nb");
  viewport.innerHTML = html;
  hovered = null;
  svg.classList.remove("focused", "hovering");
  applyTransform();
}

// Focus edges always run sideways: from the right edge of the left pill to the left edge of the right
// pill, fanned out a little where they meet the object in the middle.
function focusRoute(edges, centerId) {
  const centerPill = state.layout.items.get(centerId);
  const fan = { left: [], right: [] };
  for (const edge of edges) {
    const other = edge.a.key === centerId ? edge.b : edge.a;
    edge.otherPill = other.box;
    fan[other.box.x < centerPill.x ? "left" : "right"].push(edge);
  }
  for (const list of Object.values(fan)) {
    list.sort((p, q) => p.otherPill.y - q.otherPill.y);
    const step = Math.min(3, (centerPill.h - 8) / Math.max(1, list.length));
    list.forEach((edge, index) => { edge.fanOffset = (index - (list.length - 1) / 2) * step; });
  }
  for (const edge of edges) {
    const fromPill = edge.a.box, toPill = edge.b.box;
    const forward = fromPill.x < toPill.x;
    const anchor = (pill, side) => [side === "right" ? pill.x + pill.w : pill.x, pill.y + pill.h / 2 + (pill === centerPill ? edge.fanOffset : 0)];
    const [x1, y1] = anchor(fromPill, forward ? "right" : "left"), [x2, y2] = anchor(toPill, forward ? "left" : "right");
    const bend = Math.max(40, Math.abs(x2 - x1) * 0.45) * (forward ? 1 : -1);
    edge.path = `M${x1},${y1} C${x1 + bend},${y1} ${x2 - bend},${y2} ${x2},${y2}`;
    edge.mid = [(x1 + x2) / 2, (y1 + y2) / 2];
  }
}

// The module map keeps its zoom and pan across pages; the focus graph is framed anew for each object.
const VIEW_KEY = "tx-structure-view-" + VIEW;
function saveModulesView() {
  if (EMBED && state.mode === "modules") localStorage.setItem(VIEW_KEY, JSON.stringify({ zoom: state.zoom, panX: state.panX, panY: state.panY }));
}
function restoreModulesView() {
  const saved = JSON.parse(localStorage.getItem(VIEW_KEY) || "null");
  if (saved) { Object.assign(state, saved); applyTransform(); } else fit();
}
function setMode(mode) {
  state.mode = mode;
  render();
  if (mode === "focus") fit(1); else restoreModulesView();
  document.querySelectorAll("#mode-seg button").forEach((button) => {
    button.classList.toggle("on", button.dataset.mode === mode);
    button.disabled = button.dataset.mode === "focus" && !state.focusId;
  });
}
function applyTransform() {
  const rect = svg.getBoundingClientRect();
  viewport.setAttribute("transform", `translate(${rect.width / 2 - state.panX * state.zoom},${rect.height / 2 - state.panY * state.zoom}) scale(${state.zoom})`);
}
function bounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const box of state.layout.modules.values()) { minX = Math.min(minX, box.x); minY = Math.min(minY, box.y); maxX = Math.max(maxX, box.x + box.w); maxY = Math.max(maxY, box.y + box.h); }
  return { minX, minY, maxX, maxY };
}
function fit(maxZoom = 1.4) {
  const { minX, minY, maxX, maxY } = bounds();
  const rect = svg.getBoundingClientRect();
  state.zoom = Math.min(maxZoom, (rect.width - 60) / (maxX - minX), (rect.height - 110) / (maxY - minY));
  state.panX = (minX + maxX) / 2; state.panY = (minY + maxY) / 2 + 12 / state.zoom;
  applyTransform();
}
function reveal(box) {
  if (!box) return;
  const rect = svg.getBoundingClientRect();
  const sx = (box.x + box.w / 2 - state.panX) * state.zoom + rect.width / 2, sy = (box.y + box.h / 2 - state.panY) * state.zoom + rect.height / 2;
  if (sx < 60 || sy < 60 || sx > rect.width - 60 || sy > rect.height - 60) {
    state.panX = box.x + box.w / 2; state.panY = box.y + box.h / 2;
    if (!EMBED && state.zoom < 0.55) state.zoom = 0.75;
    applyTransform();
  }
}

// pan & zoom
let drag = null;
let dragged = false;
svg.addEventListener("mousedown", (event) => { drag = { x: event.clientX, y: event.clientY, panX: state.panX, panY: state.panY, moved: false }; });
window.addEventListener("mousemove", (event) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 4) return;
  drag.moved = true;
  svg.classList.add("panning");
  state.panX = drag.panX - (event.clientX - drag.x) / state.zoom; state.panY = drag.panY - (event.clientY - drag.y) / state.zoom; applyTransform();
});
window.addEventListener("mouseup", () => { dragged = Boolean(drag && drag.moved); if (dragged) saveModulesView(); drag = null; svg.classList.remove("panning"); });
svg.addEventListener("wheel", (event) => {
  event.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = event.clientX - rect.left - rect.width / 2, my = event.clientY - rect.top - rect.height / 2;
  const wx = state.panX + mx / state.zoom, wy = state.panY + my / state.zoom;
  state.zoom = Math.max(0.2, Math.min(3, state.zoom * Math.exp(-event.deltaY * 0.0015)));
  state.panX = wx - mx / state.zoom; state.panY = wy - my / state.zoom;
  applyTransform();
  saveModulesView();
}, { passive: false });
new ResizeObserver(() => applyTransform()).observe(svg);

svg.addEventListener("click", (event) => {
  if (dragged) { dragged = false; return; }
  const head = event.target.closest(".mod-head");
  if (head) {
    const module = head.dataset.module;
    // Embedded: a header expands or collapses its module on the map; from Focus it opens the map with that module expanded.
    if (EMBED) {
      if (state.mode === "focus") { state.expanded.add(module); setMode("modules"); return; }
      if (visibleItems(module).length) { if (state.expanded.has(module)) state.expanded.delete(module); else state.expanded.add(module); }
      render();
      return;
    }
    if (visibleItems(module).length) { if (state.expanded.has(module)) state.expanded.delete(module); else state.expanded.add(module); }
    select("module/" + module);
    return;
  }
  const item = event.target.closest(".item");
  if (item) { follow(item.dataset.id); return; }
  const edge = event.target.closest(".edge");

});
svg.addEventListener("mousemove", (event) => {

  if (!edgeElement) { tip.style.display = "none"; return; }

svg.addEventListener("mouseleave", () => { tip.style.display = "none"; setHover(null); });
let hovered = null;
function setHover(element) {

  svg.classList.toggle("hovering", Boolean(element));

// A link hovered in the rustdoc page: light the item if it is drawn; on the module map, fall back to its module.
function hoverPage(page) {
  const id = page && (pageToId.get(page) || pageToId.get(page.split("#")[0]));
  const card = id && cards.get(id);
  let element = null;
  if (id && id.startsWith("module/")) element = viewport.querySelector(`.mod[data-module="${id.slice(7)}"]`);
  else if (card) element = viewport.querySelector(`.item[data-id="${CSS.escape(id)}"]`)

svg.addEventListener("mouseover", (event) => {

const nameOfKey = (key) => key.startsWith("module/") ? key.slice(7) + ".rs" : cards.get(key).name;
function edgeTip(edge) {
  if (edge.kind === "import") return `<div class="t">${edge.a.module}.rs → ${edge.b.module}.rs</div><div class="v">use crate::${edge.b.module} (no interface-level link)</div>`;
  const verb = { has: "holds", calls: "calls", uses: "mentions" };
  const lines = edge.edges.slice(0, 8).map((e) => `${cards.get(e.source).name} <b>${verb[e.kind]}</b> ${cards.get(e.target).name} <span style="color:#666">· ${e.via.map((v) => v.label).slice(0, 2).join(", ")}${e.via.length > 2 ? "…" : ""}</span>`);
  return `<div class="t">${escapeHtml(nameOfKey(edge.a.key))} → ${escapeHtml(nameOfKey(edge.b.key))}</div><div class="v">${lines.join("<br>")}${edge.edges.length > 8 ? `<br>… ${edge.edges.length - 8} more` : ""}</div>`;
}

// ---------- panel ----------------------------------------------------------------------------------------
function depRows(edges, direction) {
  if (!edges.length) return '<div class="none">none</div>';
  return `<div class="dep">${edges.sort((a, b) => cards.get(direction === "out" ? a.target : a.source).name.localeCompare(cards.get(direction === "out" ? b.target : b.source).name)).map((edge) => {
    const other = cards.get(direction === "out" ? edge.target : edge.source);
    const vias = edge.via.map((via) => { const method = viaMethod(edge.source, via); return method ? `<a data-id="${escapeHtml(method.id)}">${escapeHtml(via.label)}</a>` : escapeHtml(via.label); }).join(", ");
    return `<div class="to"><a class="ref" data-id="${escapeHtml(other.id)}">${escapeHtml(other.name)}</a></div><div class="via">${vias}</div>`;
  }).join("")}</div>`;
}
function implBlock(card) {
  if (!card.sections.length || card.kind === "trait") return "";
  let html = `<div class="impl"><div class="open">${highlight("impl " + card.name + " {")}</div>`;
  for (const section of card.sections) {
    if (section.label) html += `<div class="section">// ${escapeHtml(section.label)}</div>`;
    for (const id of section.methods) {
      const method = cards.get(id);
      const flag = hasWarning(method) ? ' <span style="color:var(--warn)">⚠ review</span>' : method.note ? ' <span style="color:var(--accent-2)">✎ note</span>' : "";
      html += `<div class="row${dimmed(method) ? " dim" : ""}"><div class="sig">${highlight(method.declaration, method)}</div>${method.summary || flag ? `<div class="what">${escapeHtml(method.summary)}${flag}</div>` : ""}</div>`;
    }
  }
  return html + `<div class="close">}</div></div>`;
}

function showCard(card) {
  const owner = card.owner ? cards.get(card.owner) : null;
  let siblings = "";
  if (owner) {
    const list = owner.sections.flatMap((section) => section.methods);
    const index = list.indexOf(card.id);
    siblings = `<span class="siblings">${list[index - 1] ? `<a data-id="${escapeHtml(list[index - 1])}">← ${escapeHtml(cards.get(list[index - 1]).name)}</a>` : ""}${list[index + 1] ? `<a data-id="${escapeHtml(list[index + 1])}">${escapeHtml(cards.get(list[index + 1]).name)} →</a>` : ""}</span>`;
  }
  const path = owner ? `${owner.name}::${card.name}` : isPublic(card) ? `tx_core::${card.name}` : `${card.module}::${card.name}`;
  const chips = [`<span class="chip">${card.kind}</span>`, `<span class="chip">${escapeHtml(path)}</span>`, `<span class="chip">${card.module}.rs:${card.line}</span>`];
  if (INTERNAL || !isPublic(card)) chips.push(`<span class="chip vis-${card.visibility === "module-path" ? "hidden" : card.visibility}">${VISIBILITY_LABEL[card.visibility]}</span>`);
  let html = EMBED ? "" : `<div class="crumbs"><span><a data-id="module/${card.module}">${card.module}.rs</a>${owner ? ` › <a data-id="${escapeHtml(owner.id)}">${escapeHtml(owner.name)}</a>` : ""}</span>${siblings}</div>
    <h1>${escapeHtml(card.name)}${!EMBED && DATA.urls[card.id] ? `<a class="docs-link" href="${DATA.urls[card.id]}">rustdoc ↗</a>` : ""}</h1><div class="chips">${chips.join("")}</div>
    <div class="summary">${card.summary ? inline(card.summary) : '<span class="none">no doc comment</span>'}</div>`;
  if (!EMBED && card.note) html += noteHtml(card.note, card.noteFrom);
  if (!EMBED) html += `<pre class="decl">${highlight(card.display || card.declaration)}</pre>` + implBlock(card);
  if (EMBED) return;
  const relation = (title, list, direction) => list.length ? `<h2>${title}</h2>${depRows(list, direction)}` : "";
  if (card.kind === "method" && INTERNAL) {
    const calls = DATA.callEdges.filter((e) => e.source === card.id).map((e) => cards.get(e.target));
    const callers = DATA.callEdges.filter((e) => e.target === card.id).map((e) => cards.get(e.source));
    const callList = (title, list) => `<h2>${title}</h2>${list.length ? `<div class="dep">${list.map((c) => `<div class="to"><a class="ref" data-id="${escapeHtml(c.id)}">${escapeHtml(c.title)}</a></div><div class="via">${escapeHtml(VISIBILITY_LABEL[c.visibility])}</div>`).join("")}</div>` : '<div class="none">none</div>'}`;
    html += callList("Calls →", calls) + callList("Called by ←", callers);
  }
  if (card.kind === "method") {
    html += `<h2>Types in this signature</h2>${card.mentions.length ? `<div class="dep">${card.mentions.map((id) => `<div class="to"><a class="ref" data-id="${escapeHtml(id)}">${escapeHtml(cards.get(id).name)}</a></div><div class="via">${escapeHtml(cards.get(id).summary || "")}</div>`).join("")}</div>` : '<div class="none">none</div>'}`;
  } else {
    const out = DATA.edges.filter((e) => e.source === card.id), inc = DATA.edges.filter((e) => e.target === card.id);
    const of = (list, kind) => list.filter((e) => e.kind === kind);
    const block = relation("Holds (fields, variants) →", of(out, "has"), "out") + relation("Calls into →", of(out, "calls"), "out")
      + relation("Mentions in signatures →", of(out, "uses"), "out") + relation("Held by ←", of(inc, "has"), "in")
      + relation("Called by ←", of(inc, "calls"), "in") + relation("Mentioned by ←", of(inc, "uses"), "in");
    html += block || '<h2>Relations</h2><div class="none">none</div>';
  }
  const fullDoc = card.doc.join("\n").trim();
  if (!EMBED && fullDoc && fullDoc.replace(/\s+/g, " ") !== card.summary) html += `<h2>Doc comment</h2><div class="prose">${fullDoc.split(/\n\s*\n/).map((p) => `<p>${inline(p.replace(/\n/g, " "))}</p>`).join("")}</div>`;
  document.getElementById("card").innerHTML = html;
}

function showModule(module) {
  const info = DATA.modules.find((m) => m.module === module);
  const items = DATA.cards.filter((c) => c.kind !== "method" && c.module === module);
  const importsOut = info.imports.filter((m) => m !== "lib"), importsIn = DATA.modules.filter((m) => m.imports.includes(module)).map((m) => m.module);
  const usesOut = new Map(), usesIn = new Map();
  for (const edge of DATA.edges) {
    const s = cards.get(edge.source).module, t = cards.get(edge.target).module;
    if (s === t) continue;
    if (s === module) usesOut.set(t, (usesOut.get(t) || 0) + 1);
    if (t === module) usesIn.set(s, (usesIn.get(s) || 0) + 1);
  }
  const moduleList = (names, counts) => names.length ? `<div class="dep">${names.map((m) => `<div class="to"><a data-id="module/${m}">${m}.rs</a></div><div class="via">${counts.get(m) ? `${counts.get(m)} interface link${counts.get(m) > 1 ? "s" : ""}` : "import only"}</div>`).join("")}</div>` : '<div class="none">none</div>';
  const moduleUrl = DATA.urls["module/" + module];
  let html = EMBED ? "" : `<div class="crumbs"><span>module</span></div><h1>${module}.rs${moduleUrl ? `<a class="docs-link" ${EMBED ? `data-id="module/${module}"` : `href="${moduleUrl}"`}>rustdoc ↗</a>` : ""}</h1><div class="chips"><span class="chip">${MODULE_ROLE[module]}</span><span class="chip">poc/tx-core/src/${module}.rs</span></div>
    <div class="summary">${info.doc ? inline(info.doc) : ""}</div>`;
  if (!EMBED) html += `<h2>${INTERNAL ? "Items" : "Interfaces"} · ${items.length}</h2>${items.length ? `<div class="mod-items">${items.map((c) => `<div><span class="badge b-${c.kind}" style="display:inline-block;margin-right:6px">${c.kind[0].toUpperCase()}</span><a class="ref" data-id="${escapeHtml(c.id)}" style="${dimmed(c) ? "color:#8d8d8d;font-style:italic" : ""}">${escapeHtml(c.name)}</a></div>`).join("")}</div>` : '<div class="none">nothing public — internal module</div>'}`;
  html += `<h2>Imports (use crate::…) →</h2>${moduleList(importsOut, usesOut)}`;
  html += `<h2>Imported by ←</h2>${moduleList(importsIn, usesIn)}`;
  document.getElementById("card").innerHTML = html;
}

function showEdge(edge) {
  if (edge.kind === "import") { select("module/" + edge.a.module); return; }
  const rows = edge.edges.map((e) => {
    const source = cards.get(e.source), target = cards.get(e.target);
    const vias = e.via.map((via) => { const method = viaMethod(e.source, via); return method ? `<a data-id="${escapeHtml(method.id)}">${escapeHtml(via.label)}</a>` : escapeHtml(via.label); }).join(", ");
    return `<div class="to"><a class="ref" data-id="${escapeHtml(source.id)}">${escapeHtml(source.name)}</a> → <a class="ref" data-id="${escapeHtml(target.id)}">${escapeHtml(target.name)}</a></div><div class="via">${vias}</div>`;
  }).join("");
  document.getElementById("card").innerHTML = `<div class="crumbs"><span>dependency</span></div><h1 style="font-size:17px">${escapeHtml(nameOfKey(edge.a.key))} → ${escapeHtml(nameOfKey(edge.b.key))}</h1>
    <div class="summary">${edge.edges.length} interface link${edge.edges.length > 1 ? "s" : ""}. Each row says which declaration line or public method carries the reference.</div><div class="dep">${rows}</div>`;
}

// ---------- selection & navigation -------------------------------------------------------------------
function follow(id) {

}
function focusPage(page) {
  const id = pageToId.get(page) || pageToId.get(page.split("#")[0]);

  render();

}
function showModuleOverview() {

}
function switchView(view) {
  const page = PARAMS.get("page") || "tx_core/index.html";

window.addEventListener("message", (event) => {

function selectEmbedded(id) {

}
function select(id, push = true) {

  state.selected = id;
  const card = cards.get(id);
  if (card && card.owner && !indexOpen.has(card.owner)) { indexOpen.add(card.owner); buildIndex(); }
  if (card) {
    const base = card.kind === "method" ? cards.get(card.owner) : card;

  }
  document.getElementById("panel").scrollTop = 0;
  for (const entry of document.querySelectorAll(".entry, .group-label")) entry.classList.toggle("active", entry.dataset.id === id);
  document.querySelector(`.entry[data-id="${CSS.escape(id)}"], .group-label[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
  hidePreview();
}

const indexOpen = new Set(["core/TxCore"]);
let indexFilter = "";
function buildIndex(filter = indexFilter) {
  indexFilter = filter;
  const query = filter.trim().toLowerCase();
  const match = (card) => !query || card.title.toLowerCase().includes(query) || (card.summary || "").toLowerCase().includes(query);
  let html = "";
  for (const group of DATA.groups) {
    let body = "";
    for (const id of group.ids) {
      const card = cards.get(id);
      const count = card.sections.reduce((sum, section) => sum + section.methods.length, 0);
      const open = count && (indexOpen.has(id) || (query && card.sections.some((s) => s.methods.some((m) => match(cards.get(m))))));
      const methodRows = open ? card.sections.map((section) => {
        const rows = section.methods.map((mid) => cards.get(mid)).filter((method) => match(method) || match(card));
        return rows.length ? `<div class="sub-label">${escapeHtml(section.label)}</div>` + rows.map((method) =>
          `<div class="entry sub${dimmed(method) ? " modpath" : ""}" data-id="${escapeHtml(method.id)}" title="${escapeHtml(VISIBILITY_LABEL[method.visibility])}">${escapeHtml(method.name)}${hasWarning(method) ? '<span class="flag">⚠</span>' : ""}</div>`).join("") : "";
      }).join("") : "";
      if (!match(card) && !methodRows) continue;
      if (!query && (INTERNAL ? card.kind === "const" && !state.showConsts : !isPublic(card) && !state.showModulePath)) continue;
      const caret = count ? `<span class="caret" data-caret="${escapeHtml(id)}" title="${count} methods">${open ? "▾" : "▸"}</span>` : '<span class="caret"></span>';
      body += `<div class="entry${dimmed(card) ? " modpath" : ""}" data-id="${escapeHtml(card.id)}" title="${escapeHtml(VISIBILITY_LABEL[card.visibility])}">${caret}<span class="badge b-${card.kind}">${card.kind[0].toUpperCase()}</span>${escapeHtml(card.title)}${count ? `<span class="count">${count}</span>` : ""}${hasWarning(card) ? '<span class="flag">⚠</span>' : ""}</div>${methodRows}`;
    }
    if (query && !body) continue;
    const color = MODULE_COLORS[group.module];
    html += `<div class="group"><div class="group-label" data-id="module/${group.module}"><span class="mdot" style="background:${color}"></span>${escapeHtml(group.label)}</div>${body || '<div class="entry empty-mod">internal only — nothing public</div>'}</div>`;
  }
  document.getElementById("list").innerHTML = html || '<div class="none" style="padding:8px">no matches</div>';
  const current = decodeURIComponent(location.hash.slice(2));
  for (const entry of document.querySelectorAll(".entry, .group-label")) entry.classList.toggle("active", entry.dataset.id === current);
}
document.getElementById("list").addEventListener("click", (event) => {
  const caret = event.target.closest("[data-caret]");
  if (!caret) return;
  event.stopPropagation();
  const id = caret.dataset.caret;
  if (indexOpen.has(id)) indexOpen.delete(id); else indexOpen.add(id);
  buildIndex();
}, true);

// hover preview over links in the panel
const preview = document.getElementById("preview");
let previewTimer = null;
function hidePreview() { clearTimeout(previewTimer); preview.style.display = "none"; }
document.addEventListener("mouseover", (event) => {
  const link = !EMBED && event.target.closest("#card a.ref");
  if (!link) return;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    const card = cards.get(link.dataset.id);
    if (!card) return;
    const text = card.display || card.declaration;
    const declaration = text.split("\n").slice(0, 22).join("\n") + (text.split("\n").length > 22 ? "\n…" : "");
    const methods = card.sections.flatMap((s) => s.methods).map((id) => "    " + cards.get(id).declaration);
    const extra = methods.length ? `\n\nimpl ${card.name} {\n${methods.slice(0, 8).join("\n")}${methods.length > 8 ? "\n    …" : ""}\n}` : "";
    preview.innerHTML = `<div class="p-title">${escapeHtml(card.title)}</div><div class="p-sum">${escapeHtml(card.summary || "")}</div><pre>${highlight(declaration + extra)}</pre>`;
    const rect = link.getBoundingClientRect();
    preview.style.display = "block";
    const left = Math.max(8, rect.left - preview.offsetWidth - 12);
    preview.style.left = left + "px";
    preview.style.top = Math.max(8, Math.min(innerHeight - preview.offsetHeight - 8, rect.top - 20)) + "px";
  }, 220);
});
document.addEventListener("mouseout", (event) => { if (event.target.closest("#card a.ref")) hidePreview(); });

// quick switcher
const switcher = document.getElementById("switcher"), switchInput = document.getElementById("switch-input"), switchResults = document.getElementById("switch-results");
const switchTargets = DATA.cards.map((card) => ({ id: card.id, title: card.title, kind: card.kind, summary: card.summary }))
  .concat(DATA.modules.map((m) => ({ id: "module/" + m.module, title: m.module + ".rs", kind: "module", summary: MODULE_ROLE[m.module] })));
let switchSelection = 0, switchMatches = [];
function fuzzy(query, text) {
  let position = 0, score = 0;
  for (const char of query) { const found = text.indexOf(char, position); if (found < 0) return -1; score += found - position; position = found + 1; }
  return score + (text.startsWith(query) ? -5 : 0) + text.length * 0.01;
}
function updateSwitcher() {
  const query = switchInput.value.trim().toLowerCase();
  switchMatches = switchTargets.map((target) => ({ target, score: query ? fuzzy(query, target.title.toLowerCase()) : (order.indexOf(target.id) + 1 || 999) }))
    .filter((entry) => entry.score >= 0).sort((a, b) => a.score - b.score).slice(0, 40).map((entry) => entry.target);
  switchSelection = Math.min(switchSelection, Math.max(0, switchMatches.length - 1));
  switchResults.innerHTML = switchMatches.map((target, index) => `<div class="r${index === switchSelection ? " sel" : ""}" data-index="${index}"><span class="badge b-${target.kind}" style="${target.kind === "module" ? "background:#666" : ""}">${target.kind === "module" ? "M" : target.kind[0].toUpperCase()}</span><span class="n">${escapeHtml(target.title)}</span><span class="s">${escapeHtml(target.summary || "")}</span></div>`).join("");
  switchResults.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
}
function openSwitcher() { switcher.classList.add("open"); switchInput.value = ""; switchSelection = 0; updateSwitcher(); switchInput.focus(); }
function closeSwitcher() { switcher.classList.remove("open"); }
switchInput.addEventListener("input", () => { switchSelection = 0; updateSwitcher(); });
switchInput.addEventListener("keydown", (event) => {
  if (event.key === "ArrowDown") { switchSelection = Math.min(switchSelection + 1, switchMatches.length - 1); updateSwitcher(); event.preventDefault(); }
  if (event.key === "ArrowUp") { switchSelection = Math.max(switchSelection - 1, 0); updateSwitcher(); event.preventDefault(); }
  if (event.key === "Enter" && switchMatches[switchSelection]) { closeSwitcher(); select(switchMatches[switchSelection].id); }
  if (event.key === "Escape") closeSwitcher();
});
switchResults.addEventListener("click", (event) => { const row = event.target.closest(".r"); if (row) { closeSwitcher(); select(switchMatches[+row.dataset.index].id); } });
switcher.addEventListener("click", (event) => { if (event.target === switcher) closeSwitcher(); });

// wiring
document.getElementById("ref").textContent = DATA.meta.ref;
document.addEventListener("click", (event) => {
  if (event.target.closest("#svg, #switcher")) return;
  const target = event.target.closest("[data-id]");
  if (target) { event.preventDefault(); follow(target.dataset.id); }
});
// Settings redraw at once and keep the current zoom and pan; only Fit moves the view.
document.getElementById("expand-all").onclick = () => { moduleNames.forEach((m) => state.expanded.add(m)); applySettings(); };
document.getElementById("collapse-all").onclick = () => { state.expanded.clear(); applySettings(); };
document.getElementById("fit").onclick = () => fit();
document.getElementById("toggles").innerHTML = TOGGLES.map(([key, label, , title]) =>
  `<label class="toggle" title="${escapeHtml(title)}"><input type="checkbox" data-toggle="${key}" ${state[key] ? "checked" : ""}> ${label}</label>`).join("");
function applySettings() {
  render();
  buildIndex();
  if (cards.has(state.selected)) showCard(cards.get(state.selected));
}
document.querySelectorAll("[data-toggle]").forEach((input) => input.onchange = () => {
  state[input.dataset.toggle] = input.checked;
  applySettings();
});
function setToggle(key, value) {
  state[key] = value;
  const input = document.querySelector(`[data-toggle="${key}"]`);
  if (input) input.checked = value;
  buildIndex();
}
// The legend draws each edge and item style exactly as the graph does.
const LEGEND_SAMPLE = {
  holds: `<path d="M3,7 H42" stroke="#8a8a8a" stroke-width="1.8" marker-start="url(#diamond-grey)" marker-end="url(#arrow-grey)"/>`,
  calls: `<path d="M3,7 H42" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow-grey)"/>`,
  signature: `<path d="M3,7 H42" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-grey)"/>`,
  imports: `<path d="M3,7 H42" stroke="#8a8a8a" stroke-width="1.1" stroke-dasharray="2 5" opacity=".7" marker-end="url(#arrow-grey)"/>`,
  count: `<path d="M3,7 H42" stroke="#8a8a8a" stroke-width="2.6"/><text class="legend-count" x="22.5" y="11" text-anchor="middle">3</text>`,
  private: `<rect class="legend-pill" x="1" y="0.5" width="44" height="13" rx="4"/><text class="legend-name" x="6" y="10" font-style="italic">name</text>`,
  hidden: `<rect class="legend-pill legend-hidden" x="1" y="0.5" width="44" height="13" rx="4"/><text class="legend-name" x="6" y="10">name</text>`,
};
const legendRow = (sample, label) => `<div class="legend-row"><svg width="46" height="14">${LEGEND_SAMPLE[sample]}</svg><span>${label}</span></div>`;
document.getElementById("legend").innerHTML = INTERNAL
  ? legendRow("holds", "A holds B in a field") + legendRow("calls", "A calls into B") + legendRow("signature", "A's signature mentions B")
    + legendRow("imports", "import only") + legendRow("count", "number of item links")
    + legendRow("private", "private / pub(crate)") + legendRow("hidden", "#[doc(hidden)]")
  : legendRow("holds", "A holds B in a public field") + legendRow("signature", "A's public signatures mention B")
    + legendRow("imports", "import only") + legendRow("count", "number of item links")
    + legendRow("private", "pub via module path only");
document.querySelectorAll("#view-seg button, #embed-seg button").forEach((button) => {
  button.classList.toggle("on", button.dataset.view === VIEW);
  button.onclick = () => { if (button.dataset.view === VIEW) return; if (EMBED) switchView(button.dataset.view); else location.href = `../${button.dataset.view}/structure.html`; };
});
if (EMBED) {
  document.getElementById("app").classList.add("embed");
  document.getElementById("embed-seg").style.display = "";
  // Move the toolbar's controls into the settings popover.
  const config = document.getElementById("config"), configButton = document.getElementById("config-button");
  const section = (title, ...elements) => {
    const heading = document.createElement("div");
    heading.className = "config-title";
    heading.textContent = title;
    const row = document.createElement("div");
    row.className = "config-row";
    row.append(...elements);
    config.append(heading, row);
  };
  section("View", document.getElementById("embed-seg"));
  section("Show", ...document.getElementById("toggles").children);
  section("Layout", ...["expand-all", "collapse-all", "fit"].map((id) => document.getElementById(id)));
  document.getElementById("fit").onclick = () => { fit(state.mode === "focus" ? 1 : 1.4); saveModulesView(); };
  document.querySelectorAll("#mode-seg button").forEach((button) => button.onclick = () => setMode(button.dataset.mode));
  section("Edges", document.getElementById("legend"));
  const setConfigOpen = (open) => {
    config.classList.toggle("open", open);
    configButton.classList.toggle("on", open);
  };
  configButton.onclick = () => setConfigOpen(!config.classList.contains("open"));
  document.addEventListener("click", (event) => { if (!event.target.closest("#config, #config-button")) setConfigOpen(false); });
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") setConfigOpen(false); });
}
const filter = document.getElementById("filter");
filter.addEventListener("input", () => buildIndex(filter.value));
filter.addEventListener("keydown", (event) => {
  if (event.key === "Enter") { const first = document.querySelector(".entry"); if (first) { select(first.dataset.id); filter.blur(); } }
  if (event.key === "Escape") { filter.value = ""; buildIndex(); filter.blur(); }
});
function step(delta) {
  const index = order.indexOf(state.selected);
  select(order[Math.max(0, Math.min(order.length - 1, (index < 0 ? -1 : index) + delta))]);
}
document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openSwitcher(); return; }
  if (event.target.tagName === "INPUT") return;
  if (event.key === "/") { event.preventDefault(); filter.focus(); }
  else if (event.key === "j" || event.key === "ArrowDown") { event.preventDefault(); step(1); }
  else if (event.key === "k" || event.key === "ArrowUp") { event.preventDefault(); step(-1); }
  else if (event.key === "[") history.back();
  else if (event.key === "]") history.forward();
  else if (event.key === "f") fit();
  else if (event.key === "u") { const card = cards.get(state.selected); if (card && card.owner) select(card.owner); else if (card) select("module/" + card.module); }
  else if (event.key === "e") {
    const card = cards.get(state.selected);
    const module = card ? card.module : state.selected && state.selected.startsWith("module/") ? state.selected.slice(7) : null;
    if (module) { if (state.expanded.has(module)) state.expanded.delete(module); else state.expanded.add(module); render(); }
  }
});
window.addEventListener("popstate", () => { const id = decodeURIComponent(location.hash.slice(2)); if (id) select(id, false); });

buildIndex();
render();
fit();
if (EMBED) {
  focusPage(PARAMS.get("page") || "");
} else {
  const initial = decodeURIComponent(location.hash.slice(2));
  select(initial || "core/TxCore", false);
  fit();
}
</script>
</body>
