<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tx-core interface graph</title>
<style>
:root {
  --bg: #1e1e1e; --bg-2: #252525; --bg-hover: #333; --border: #353535;
  --text: #dcddde; --muted: #9a9a9a; --faint: #666; --accent: #8b7cf6; --accent-2: #a99cff;
  --code-bg: #191919; --warn: #e5a54b; --note: #5fa8e8;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.55 var(--font); overflow: hidden; }
a { color: var(--accent-2); text-decoration: none; cursor: pointer; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #3b3b3b; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
#app { display: grid; grid-template-columns: 250px 1fr 480px; height: 100vh; }
#app.no-panel { grid-template-columns: 250px 1fr 0; }
#app.embed { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
#app.embed #panel { display: none; }
html.embed.resizing-panel, html.embed.resizing-panel * { cursor: row-resize !important; user-select: none; }
#app.embed #index, #app.embed .legend { display: none; }
#app.embed #panel { border-left: 0; border-top: 1px solid var(--border); }
#app.embed #card { padding: 12px 18px 40px; }
@font-face { font-family: "Fira Sans"; font-weight: 400; src: url("static.files/FiraSans-Regular-0fe48ade.woff2") format("woff2"); }
@font-face { font-family: "Fira Sans"; font-weight: 500; src: url("static.files/FiraSans-Medium-e1aa3f0a.woff2") format("woff2"); }
@font-face { font-family: "Source Code Pro"; font-weight: 400; src: url("static.files/SourceCodePro-Regular-8badfe75.ttf.woff2") format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 400; src: url("static.files/SourceSerif4-Regular-6b053e98.ttf.woff2") format("woff2"); }
/* Embedded in rustdoc: rustdoc's fonts and theme variables (light defaults, replaced by the page's). */
html.embed {
  --main-background-color: white; --main-color: black; --sidebar-background-color: #f5f5f5;
  --sidebar-background-color-hover: #e0e0e0; --border-color: #e0e0e0; --headings-border-bottom-color: #ddd;
  --code-block-background-color: #f5f5f5; --button-background-color: #fff; --right-side-color: grey;
  --link-color: #3873ad; --mod-link-color: #3873ad; --type-link-color: #ad378a; --trait-link-color: #6e4fc9;
  --function-link-color: #ad7c37; --target-background-color: #fdffd3; --target-border-color: #ad7c37;
  --warning-border-color: #ff8e00; --search-input-focused-border-color: #66afe9;
  --scrollbar-track-background-color: #dcdcdc; --scrollbar-thumb-background-color: rgba(36,37,39,.6);
  --ui-font: "Fira Sans", Arial, NanumBarunGothic, sans-serif; --code-font: "Source Code Pro", monospace;
}
html.embed.waiting body { visibility: hidden; }
html.embed, html.embed body { background: var(--main-background-color); color: var(--main-color); font: 15px/1.5 var(--ui-font); }
html.embed ::-webkit-scrollbar-track { background: var(--scrollbar-track-background-color); }
html.embed ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb-background-color); border: 0; }
html.embed #graph-area { background: var(--main-background-color); }
/* Graph controls live in a settings popover, closed by default. */
html.embed .toolbar { display: none; }
#config-button, #config, #mode-seg { display: none; }
html.embed #mode-seg { display: flex; position: absolute; top: 8px; left: 10px; z-index: 3; margin: 0; }
html.embed #mode-seg button:disabled { opacity: .4; cursor: default; }
html.embed #config-button { right: 10px; }
html.embed #config-button { display: block; position: absolute; top: 8px; z-index: 3; width: 30px; height: 30px; padding: 0; border: 1px solid var(--border-color); border-radius: 4px; background: var(--main-background-color); color: var(--right-side-color); font-size: 18px; line-height: 28px; cursor: pointer; }
html.embed #config-button:hover, html.embed #config-button.on { color: var(--main-color); border-color: var(--right-side-color); }
html.embed #config.open { display: block; position: absolute; top: 44px; right: 10px; z-index: 4; width: 270px; padding: 10px 14px 12px; background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.15); font: 14px var(--ui-font); }
html.embed #config .config-title { font-weight: 500; font-size: 15px; margin: 10px 0 5px; }
html.embed #config .config-title:first-child { margin-top: 0; }
html.embed #config .config-row { display: flex; flex-wrap: wrap; gap: 6px; }
html.embed #config .toggle { display: flex; border: 0; padding: 2px 0; background: none; }
html.embed #config .config-row:has(.toggle) { flex-direction: column; gap: 0; }
html.embed #config .legend { display: block; position: static; background: none; padding: 0; font-size: 13px; line-height: 1.5; color: var(--right-side-color); }
html.embed #config .legend b { color: var(--main-color); font-weight: 500; }
.legend-row { display: flex; align-items: center; gap: 10px; line-height: 1.75; }
.legend-row svg { flex: none; overflow: visible; }
html.embed #config .legend-row { color: var(--main-color); font-size: 13.5px; }
.legend-pill { fill: var(--main-background-color, #2b2b2b); stroke: var(--border-color, #555); }
.legend-pill.legend-hidden { stroke: var(--warning-border-color, #e5a54b); stroke-dasharray: 3 2; }
.legend-name { font: 9.5px var(--code-font, monospace); fill: var(--main-color, #ddd); }
.legend-count { font: 600 10px var(--ui-font, sans-serif); fill: var(--main-color, #ddd); paint-order: stroke; stroke: var(--main-background-color, #1a1a1a); stroke-width: 3px; }
html.embed .btn, html.embed .toggle { background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 4px; color: var(--main-color); font: 14px var(--ui-font); padding: 2px 9px; }
html.embed .btn:hover, html.embed .toggle:hover { border-color: var(--right-side-color); color: var(--main-color); }
html.embed .toggle input { accent-color: var(--link-color); }
html.embed .viewseg { background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 4px; }
html.embed .viewseg button { font: 14px var(--ui-font); color: var(--main-color); padding: 2px 11px; }
html.embed .viewseg button.on { background: var(--sidebar-background-color-hover); font-weight: 500; }
html.embed #tip { background: var(--main-background-color); border: 1px solid var(--border-color); border-radius: 4px; color: var(--main-color); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
html.embed #tip .t { color: var(--main-color); font: 500 14px var(--ui-font); }
html.embed #tip .v { color: var(--right-side-color); font: 13px var(--code-font); }
html.embed .mod-box { fill: var(--sidebar-background-color); stroke: var(--border-color); }
html.embed .mod.collapsed .mod-box { fill: var(--sidebar-background-color); }
html.embed .mod:hover .mod-box { stroke: var(--right-side-color); }
html.embed .mod.sel .mod-box { stroke: var(--link-color); stroke-width: 1.5; }
html.embed .mod-name { fill: var(--mod-link-color); font: 500 15px var(--ui-font); }
html.embed .mod-sub, html.embed .mod-toggle { fill: var(--right-side-color); font-family: var(--ui-font); }
html.embed .item rect.pill { fill: var(--main-background-color); stroke: var(--border-color); }
html.embed .item:hover rect.pill { stroke: var(--right-side-color); fill: var(--main-background-color); }
html.embed .item.sel rect.pill { fill: var(--target-background-color); stroke: var(--target-border-color); stroke-width: 1.5; }
html.embed .item.nb rect.pill { stroke: var(--link-color); }
html.embed .item.hidden rect.pill { stroke: var(--warning-border-color); stroke-dasharray: 3 2; }
html.embed .item text.name { font: 13px var(--code-font); }
html.embed .item text.kind-struct, html.embed .item text.kind-enum, html.embed .item text.kind-type { fill: var(--type-link-color); }
html.embed .item text.kind-trait { fill: var(--trait-link-color); }
html.embed .item text.kind-fn { fill: var(--function-link-color); }
html.embed .item text.kind-const { fill: var(--link-color); }
html.embed .item.mod-path text.name { font-style: italic; opacity: .75; }
html.embed .item .warn-dot { fill: var(--warning-border-color); }
html.embed .edge text { fill: var(--main-color); stroke: var(--main-background-color); font: 12px var(--ui-font); }
html.embed svg.focused .item:not(.nb):not(.sel) { opacity: .5; }
html.embed #panel { background: var(--main-background-color); color: var(--main-color); border-top: 1px solid var(--border-color); }
html.embed #card { padding: 14px 24px 30px; }
.toolbar .viewseg { margin: 0; }
.toolbar .viewseg button { padding: 3px 12px; }
.docs-link { font: 12px var(--font); margin-left: 8px; }

/* index */
#index { background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
#index .top { padding: 14px 14px 8px; }
.brand { font-weight: 650; display: flex; align-items: center; gap: 8px; }
.brand .gem { width: 12px; height: 12px; transform: rotate(45deg); background: linear-gradient(135deg, var(--accent-2), var(--accent)); border-radius: 3px; }
.ref { font: 11px var(--mono); color: var(--faint); margin: 2px 0 10px; }
#filter { width: 100%; padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: 13px var(--font); outline: none; }
#filter:focus { border-color: var(--accent); }
#list { overflow: auto; flex: 1; padding: 4px 8px 12px; }
.group { margin-top: 10px; }
.group-label { font: 600 12px var(--mono); color: #bdbdbd; padding: 3px 8px; cursor: pointer; display: flex; align-items: center; gap: 7px; border-radius: 5px; }
.group-label:hover { background: var(--bg-hover); color: #fff; }
.group-label .mdot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.entry.modpath { color: #858585; font-style: italic; }
.entry.empty-mod { color: var(--faint); font-size: 12px; font-style: italic; cursor: default; padding-left: 26px; }
.entry.empty-mod:hover { background: none; }
.group.muted .entry { color: #8d8d8d; }
.entry { display: flex; align-items: center; gap: 7px; padding: 1px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cfcfcf; }
.entry:hover { background: var(--bg-hover); }
.entry.active, .group-label.active { background: rgba(139,124,246,.22); color: #fff; }
.entry.sub { padding-left: 26px; font: 12.5px var(--mono); }
.entry .flag { margin-left: 6px; color: var(--warn); font-size: 11px; }
.entry .count { margin-left: auto; color: var(--faint); font: 10.5px var(--mono); }
.entry .count + .flag { margin-left: 6px; }
.entry .caret { width: 12px; flex: none; color: var(--muted); font-size: 12px; line-height: 1; text-align: center; }
.entry .caret[data-caret]:hover { color: var(--text); }
.entry.sub { padding-left: 40px; }
.sub-label { padding-left: 40px !important; }
.sub-label { font-size: 10.5px; color: var(--faint); padding: 3px 8px 0 26px; }
.badge { font: 600 9.5px var(--mono); padding: 0 4px; border-radius: 3px; color: #1e1e1e; flex: none; width: 15px; text-align: center; line-height: 15px; }
.b-struct { background: #ffcb6b; } .b-enum { background: #f78c6c; } .b-trait { background: #4fd1e8; } .b-fn { background: #82aaff; }
.b-const { background: #9a9a9a; } .b-method { background: #c3a6ff; } .b-type { background: #c3e88d; }
#keys { border-top: 1px solid var(--border); padding: 8px 14px; font-size: 11.5px; color: var(--faint); line-height: 1.8; }
kbd { font: 10.5px var(--mono); border: 1px solid #474747; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: #222; }

/* graph */
#graph-area { position: relative; min-width: 0; background: #1a1a1a; overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#svg.panning { cursor: grabbing; }
.toolbar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 2; }
.toolbar > * { pointer-events: auto; }
.btn { background: rgba(40,40,40,.95); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.btn:hover { color: var(--text); border-color: #555; }
.toggle { display: inline-flex; gap: 6px; align-items: center; background: rgba(40,40,40,.95); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); margin: 0; }
.legend { position: absolute; bottom: 10px; left: 12px; font-size: 11.5px; color: var(--faint); background: rgba(26,26,26,.9); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
.legend b { color: var(--muted); font-weight: 500; }
.viewseg { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; margin-bottom: 10px; }
.viewseg button { flex: 1; background: none; border: 0; padding: 5px 0; font: 600 12.5px var(--font); color: var(--muted); cursor: pointer; }
.viewseg button.on { background: rgba(139,124,246,.28); color: #fff; }
.viewseg button:hover { color: var(--text); }
.item.hidden rect.pill { stroke: #8a6d3b; stroke-dasharray: 3 2; }
.item.mod-path text.name { font-style: italic; }
.impl .row.dim { opacity: .62; }
.chip.vis-private, .chip.vis-crate { background: #2f2f2f; color: #9a9a9a; }
.chip.vis-hidden { background: rgba(229,165,75,.14); color: var(--warn); }
.chip.vis-public { background: rgba(99,193,116,.15); color: #7fd18f; }
#tip { position: absolute; pointer-events: none; background: rgba(30,30,30,.97); border: 1px solid #444; border-radius: 7px; padding: 6px 10px; font-size: 12.5px; display: none; max-width: 360px; z-index: 5; }
#tip .t { font: 600 12.5px var(--mono); color: #fff; }
#tip .v { color: var(--muted); font: 12px var(--mono); }
.mod-box { fill: #222; stroke: #3a3a3a; stroke-width: 1; }
.mod.collapsed .mod-box { fill: #262626; }
.mod:hover .mod-box { stroke: #666; }
.mod.sel .mod-box { stroke: var(--accent-2); stroke-width: 2; }
.mod-head { cursor: pointer; }
.mod-name { fill: #ececec; font: 600 13.5px var(--font); }
.mod-sub { fill: #8a8a8a; font: 11px var(--mono); }
.mod-toggle { fill: #8a8a8a; font: 600 15px var(--mono); }
.item { cursor: pointer; }
.item rect.pill { fill: #2b2b2b; stroke: #3d3d3d; stroke-width: 1; }
.item:hover rect.pill { stroke: #7a7a7a; fill: #313131; }
.item.sel rect.pill { stroke: #fff; stroke-width: 1.8; fill: #343046; }
.item.nb rect.pill { stroke: #8b7cf6; }
.item text.name { fill: #e2e2e2; font: 12.5px var(--mono); }
.item.mod-path text.name { fill: #9a9a9a; }
.item text.badge-t { font: 700 9.5px var(--mono); fill: #1e1e1e; }
.item .warn-dot { fill: var(--warn); }
.edge path.line { fill: none; }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge text { font: 600 10.5px var(--mono); fill: #c8c8c8; paint-order: stroke; stroke: #1a1a1a; stroke-width: 3px; pointer-events: none; }
svg.focused .edge:not(.hot) path.line { opacity: .06 !important; }
svg.focused .edge:not(.hot) text { opacity: 0; }
svg.focused .item:not(.nb):not(.sel) { opacity: .45; }
.edge.hot path.line { opacity: 1 !important; }
.edge.via-hot path.line { stroke-width: 3.2 !important; }
/* Hovering an object (or a module) isolates its connections, without redrawing. */
svg.hovering .edge:not(.hover-hot) path.line { opacity: .06 !important; }
svg.hovering .edge:not(.hover-hot) text { opacity: 0; }
svg.hovering .edge.hover-hot path.line { opacity: 1 !important; }
svg.hovering .item:not(.hover-self):not(.hover-nb) { opacity: .3; }
svg.hovering .mod:not(.hover-self):not(.hover-nb) .mod-head { opacity: .45; }
svg.hovering .item.hover-self rect.pill { stroke-width: 2; }

/* panel */
#panel { background: var(--bg-2); border-left: 1px solid var(--border); overflow: auto; min-width: 0; }
#card { padding: 18px 22px 120px; }
.crumbs { font-size: 12px; color: var(--faint); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px; }
.crumbs a { color: var(--muted); }
.siblings { display: flex; gap: 10px; } .siblings a { color: var(--muted); } .siblings a:hover { color: var(--text); }
h1 { font: 700 21px var(--mono); margin: 0 0 6px; word-break: break-word; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { font: 11px var(--mono); padding: 1px 7px; border-radius: 10px; background: #2f2f2f; color: var(--muted); }
.chip.warn { background: rgba(229,165,75,.14); color: var(--warn); }
.summary { color: #cdcdcd; margin: 4px 0 14px; font-size: 14px; }
.summary code, .note code, .prose code { font: 12px var(--mono); background: #2f2f2f; padding: 1px 5px; border-radius: 4px; color: #e7a5d0; }
pre.decl { background: var(--code-bg); border: 1px solid #2c2c2c; border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; overflow: auto; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; }
.impl { background: var(--code-bg); border: 1px solid #2c2c2c; border-radius: 8px; padding: 8px 0 10px; margin: 0 0 12px; font: 12.5px/1.55 var(--mono); }
.impl .open, .impl .close { padding: 0 14px; }
.impl .section { padding: 8px 14px 1px 28px; color: #6a737d; font-style: italic; }
.impl .row { padding: 2px 14px 2px 28px; border-left: 2px solid transparent; }
.impl .row:hover { background: #222; border-left-color: var(--accent); }
.impl .row .sig { white-space: pre-wrap; text-indent: -2ch; padding-left: 2ch; }
.impl .row .what { font: 12px/1.45 var(--font); color: #8a8a8a; }
.tok-kw { color: #c792ea; } .tok-str { color: #c3e88d; } .tok-com { color: #6a737d; font-style: italic; }
.tok-num { color: #f78c6c; } .tok-ty { color: #ffcb6b; } .tok-mac { color: #89ddff; } .tok-attr { color: #6f7c93; }
.tok-fn { color: #82aaff; } .tok-life { color: #f07178; } .tok-self { color: #f07178; font-style: italic; }
a.ref { color: inherit; border-bottom: 1px solid rgba(169,156,255,.45); }
a.ref:hover { border-bottom-color: var(--accent-2); background: rgba(139,124,246,.16); }
a.ref.method-name { color: #82aaff; font-weight: 600; border-bottom: 0; }
h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 600; margin: 18px 0 6px; }
.dep { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; align-items: baseline; }
.dep .to { font: 12.5px var(--mono); white-space: nowrap; }
.dep .via { color: var(--faint); font: 11.5px var(--mono); }
.dep .via a { color: #9d9d9d; } .dep .via a:hover { color: var(--text); }
.none { color: var(--faint); font-size: 12.5px; font-style: italic; }
.note { border-radius: 6px; padding: 8px 12px 2px; margin: 0 0 12px; background: rgba(95,168,232,.07); border-left: 3px solid var(--note); font-size: 13px; }
.note.warning { background: rgba(229,165,75,.08); border-color: var(--warn); }
.note .t { font-weight: 600; margin-bottom: 2px; color: var(--note); font-size: 12.5px; }
.note.warning .t { color: var(--warn); }
.note p { margin: 0 0 6px; }
.prose { font-size: 13px; color: #cfcfcf; } .prose p { margin: 0 0 8px; }
.priv { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.mod-items { columns: 2; font: 12.5px var(--mono); }
.mod-items div { break-inside: avoid; }

#preview { position: fixed; z-index: 50; max-width: 600px; max-height: 400px; overflow: hidden; background: #232323; border: 1px solid #444; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.5); padding: 10px 14px; display: none; pointer-events: none; }
#preview .p-title { font: 600 13px var(--mono); margin-bottom: 2px; }
#preview .p-sum { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
#preview pre { margin: 0; font: 12px/1.5 var(--mono); white-space: pre; }
#switcher { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 60; }
#switcher.open { display: flex; }
#switcher .box { width: 620px; background: #262626; border: 1px solid #444; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.6); overflow: hidden; }
#switcher input { width: 100%; padding: 14px 16px; background: transparent; border: 0; border-bottom: 1px solid #383838; color: var(--text); font: 15px var(--font); outline: none; }
#switcher .results { max-height: 420px; overflow: auto; padding: 6px; }
#switcher .r { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
#switcher .r.sel { background: rgba(139,124,246,.25); }
#switcher .r .n { font: 13px var(--mono); }

eives a handle to the core (open a", "second `TxCore` on the same state dir if you need one). Hand slow work to your own thread.", "", "Order is per core: another process's events reach you only through the log, and log order", "across processes is write order, not causal order.", "", "A panicking sink is contained with `catch_unwind`: the operation already happened and the", "log line is already written. The default panic hook still prints the panic to stderr (core", "installs no hook; that is the front end's call), the sink's own `Mutex`es are poisoned", "afterwards, and nothing is contained under `panic = \"abort\"`.", "", "Closures (`|e: &Event| …`) and `Arc<impl EventSink>` are sinks. The closure impl rules out a", "future blanket impl for `Box<T>` or `&T`; box your sink when registering it."], "summary": "An in-process listener.", "note": "`on_event(&self, &Event)`. Blanket impls for closures and `Arc<T>`.\n\nContract: called after the record is saved and every lock released, in registration order; cannot veto; gets no core handle. A sink that needs one opens a second [[TxCore]] on the same state dir — the `hooks` plugin does exactly that to seed `{\"state\": \"idle\"}` via [[TxCore::update_ext]] on `Created`.\n\nSinks only see their own process's events; other processes are visible only through `log.jsonl`.", "declaration": "pub trait EventSink: Send + Sync {\n    fn on_event(&self, event: &Event);\n}", "display": "pub trait EventSink: Send + Sync {\n    fn on_event(&self, event: &Event);\n}", "sections": [{"label": "Required", "methods": ["events/EventSink::on_event"]}], "line": 91, "lastLine": 107, "tags": ["trait", "public"], "mentions": ["events/Event"]}, {"id": "events/EventLog", "name": "EventLog", "title": "EventLog", "kind": "struct", "module": "events", "visibility": "hidden", "doc": [], "summary": "", "note": null, "declaration": "#[derive(Clone, Debug, PartialEq, Eq)]\npub struct EventLog {\n    path: PathBuf,\n}", "display": null, "sections": [{"l q)]\n#[non_exhaustive]\npub enum WorkspaceAction {\n    /// Writes `content` to `path`, creating parents, overwriting.\n    Write { path: PathBuf, content: String },\n    /// Links `dst` → `src` (`src` is the link target, used verbatim). Replaces an existing\n    /// symlink; refuses an existing file or directory.\n    Symlink { src: PathBuf, dst: PathBuf },\n}", "display": null, "sections": [], "line": 72, "lastLine": 82, "tags": ["enum", "public"], "mentions": []}, {"id": "engine/LaunchPlan", "name": "LaunchPlan", "title": "LaunchPlan", "kind": "struct", "module": "engine", "visibility": "public", "doc": ["How to start the engine: `program args…`, extra environment, and workspace preparation."], "summary": "How to start the engine: `program args…`, extra environment, and workspace preparation.", "note": null, "declaration": "#[derive(Clone, Debug, Default, PartialEq, Eq)]\n#[non_exhaustive]\npub struct LaunchPlan {\n    pub program: String,\n    pub args: Vec<String>,\n    pub env: Vec<(String, String)>,\n    pub workspace: Vec<WorkspaceAction>,\n}", "display": null, "sections": [{"label": "Constructors", "methods": ["engine/LaunchPlan::new"]}, {"label": "Builder setters", "methods": ["engine/LaunchPlan::program", "engine/LaunchPlan::arg", "engine/LaunchPlan::args", "engine/LaunchPlan::env", "engine/LaunchPlan::workspace"]}], "line": 84, "lastLine": 92, "tags": ["struct", "public"], "mentions": ["engine/WorkspaceAction"]}, {"id": "engine/EngineAdapter", "name": "EngineAdapter", "title": "EngineAdapter", "kind": "trait", "module": "engine", "visibility": "public", "doc": ["One coding-agent engine. Two required methods; no I/O in `launch`. `Send + Sync` so a core", "can be shared across threads."], "summary": "One coding-agent engine.", "note": "Two required methods, [[EngineAdapter::id]] and [[EngineAdapter::launch]], plus an optional [[EngineAdapter::envelope]].\n\nThe design point: `launch` is **pure**. The adapter only describes program, args, env and [[WorkspaceAction]]s in a [[LaunchPlan]]; core does all I/O in [[TxCore::create_locked]]. So an adapter is unit-testable without a filesystem or tmux.", "declaration": "pub trait EngineAdapter: Send + Sync {\n    /// A bare name (`[A-Za-z0-9_-]+`); stored in every record this engine launches.\n    fn id(&self) -> &str;\n    fn launch(&self, req: &LaunchRequest<'_>) -> Result<LaunchPlan, EngineError>;\n    /// How a message is framed before it is typed into one of this engine's sessions.\n    /// `sender` is the sending session's name, `None` for the user. Pure; the default is the\n    /// `<from-user>` / `<from-agent session=\"…\">` envelope.\n    fn envelope(&self, sender: Option<&str>, text: &str) -> String;  // provided\n}", "display": "pub trait EngineAdapter: Send + Sync {\n    /// A bare name (`[A-Za-z0-9_-]+`); stored in every record this engine launches.\n    fn id(&self) -> &str;\n    fn launch(\n        &self,\n        req: &LaunchRequest<'_>,\n    ) -> Result<LaunchPlan, EngineError>;\n    /// How a message is framed before it is typed into one of this engine's sessions.\n    /// `sender` is the sending session's name, `None` for the user. Pure; the default is the\n    /// `<from-user>` / `<from-agent session=\"…\">` envelope.\n    fn envelope(\n        &self,\n        sender: Option<&str>,\n        text: &str,\n    ) -> String;  // provided\n}", "sections": [{"label": "Required", "methods": ["engine/EngineAdapter::id", "engine/EngineAdapter::launch"]}, {"label": "Provided", "methods": ["engine/EngineAdapter::envelope"]}], "line": 129, "lastLine": 142, "tags": ["trait", "public"], "mentions": ["engine/EngineError", "engine/LaunchPlan", "engine/LaunchRequest"]}, {"id": "engine/EngineRegistry", "name": "EngineRegistry", "title": "EngineRegistry", "kind": "struct", "module": "engine", "visibility": "hidden", "doc": ["id → adapter. Ids are unique; registration order does not matter."], "summary": "id → adapter.", "note": null, "declaration": "#[derive(Default)]\npub st Sink`]."], "summary": "Registers an in-process listener for every event this core emits.", "note": null, "noteFrom": null, "declaration": "pub fn subscribe(&mut self, sink: Box<dyn EventSink>);", "display": "pub fn subscribe(&mut self, sink: Box<dyn EventSink>);", "sections": [], "line": 380, "lastLine": 383, "tags": ["method", "public"], "mentions": ["events/EventSink"]}, {"id": "core/TxCore::emit", "name": "emit", "title": "TxCore::emit", "kind": "method", "module": "core", "visibility": "private", "owner": "core/TxCore", "doc": ["The log line first (the file never lags the sinks), then every sink in order. Runs only", "once the operation has released its locks, so a sink may use another core on the same", "state dir. A sink that panics is contained; the operation already happened."], "summary": "The log line first (the file never lags the sinks), then every sink in order.", "note": "Per event: append to the log first (the file never lags the sinks), then every sink in registration order inside `catch_unwind`. Called only after the operation's lock guards drop — which is what lets a sink open a second core and mutate the same session without deadlock.\n\n> [!warning] Errors swallowed by design\n> A failed log append and a panicking sink are both ignored (`let _ =`). Documented — \"the operation already happened\" — but it runs against the no-swallowed-errors standard.", "noteFrom": null, "declaration": "fn emit(&self, events: Vec<Event>);", "display": "fn emit(&self, events: Vec<Event>);", "sections": [], "line": 385, "lastLine": 399, "tags": ["method", "private"], "mentions": ["events/Event"]}, {"id": "core/TxCore::list_sessions", "name": "list_sessions", "title": "TxCore::list_sessions", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Store only, never tmux — cheap, and possibly stale: a `Running` record may already be gone until someone refreshes. Filters with [[ListFilter::matches]] (all fields are conjuncts). Returns ids; callers [[TxCore::get_session]] each.", "noteFrom": null, "declaration": "pub fn list_sessions(&self, filter: &ListFilter) -> Result<Vec<SessionId>, CoreError>;", "display": "pub fn list_sessions(\n    &self,\n    filter: &ListFilter,\n) -> Result<Vec<SessionId>, CoreError>;", "sections": [], "line": 403, "lastLine": 411, "tags": ["method", "public"], "mentions": ["core/ListFilter", "error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::get_session", "name": "get_session", "title": "TxCore::get_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "One [[SessionStore::load]]; `NotFound` when there's no file.", "noteFrom": null, "declaration": "pub fn get_session(&self, id: &SessionId) -> Result<Session, CoreError>;", "display": "pub fn get_session(\n    &self,\n    id: &SessionId,\n) -> Result<Session, CoreError>;", "sections": [], "line": 413, "lastLine": 417, "tags": ["method", "public"], "mentions": ["error/CoreError", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::resolve", "name": "resolve", "title": "TxCore::resolve", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["An id first, then a name: the `Running` record with it, else the most recently created."], "summary": "An id first, then a name: the `Running` record with it, else the most recently created.", "note": "Exact id wins if the record exists. Otherwise among records with that name: the `Running` one, else the newest. Names are unique only among running records ([[TxCore::name_in_use]]), which is why stopped or exited duplicates exist and need this tie-break.", "noteFrom": null, "declaration": "pub fn resolve(&self, name_or_id: &str) -> Result<SessionId, CoreError>;", "display": "pub fn resolve(\n    &self,\n    name_or_id: &str,\n) -> Result<SessionId, CoreError>;", "sections": [], "line": 419, "lastLine": 442, "tags": ["method", "public"], "mentions": ["error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::create_session", "name": "create_session", "title": "TxCore::create_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "A thin wrapper: [[TxCore::create_locked]] does the work and returns its events; this method [[TxCore::emit]]s them after the lock is released. Every mutation follows this split.", "noteFrom": null, "declaration": "pub fn create_session(&self, opts: CreateOptions) -> Result<SessionId, CoreError>;", "display": "pub fn create_session(\n    &self,\n    opts: CreateOptions,\n) -> Result<SessionId, CoreError>;", "sections": [], "line": 446, "lastLine": 450, "tags": ["method", "public", "emits", "reaches-tmux", "reaches-write"], "mentions": ["core/CreateOptions", "error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::create_locked", "name": "create_locked", "title": "TxCore::create_locked", "kind": "method", "module": "core", "visibility": "private", "owner": "core/TxCore", "doc": [], "summary": "", "note": "**Phase 1, no lock:** name grammar ([[validate_name]]), env keys ([[validate_env]]), cwd exists and is canonicalized, engine registered, roles resolve ([[Profiles::resolve]]). An unknown engine or role never touches state.\n\n**Phase 2, under `create.lock`:** [[TxCore::name_in_use]] → mint id → env layering ([[merge_env]]: `TX_SESSION_ID`, `TX_TMUX_SOCKET`, `TX_CORE_HOME`, config env, session env, plan env) → write the profile file → [[EngineAdapter::launch]] → [[apply_workspace]] → [[Tmux::new_session]] → [[Tmux::set_tx_id]] → [[SessionStore::save]].\n\nFailures after `new-session` go through `undo`: kill the tmux session by exact name and remove the profile file. A program that exits before `@tx-id` can be set ([[session_vanished]]) is saved as `Exited` with a second event, not reported as a failure.\n\n> [!note] Minor\n> The `#[allow(unreachable_patterns)] _ => unreachable!()` arm is unneeded: the crate owns `LaunchOptions`, so `#[non_exhaustive]` doesn't apply inside it.", "noteFrom": null, "declaration": "fn create_locked(&self, opts: CreateOptions) -> Result<(SessionId, Vec<Event>), CoreError>;", "display": "fn create_locked(\n    &self,\n    opts: CreateOptions,\n) -> Result<(SessionId, Vec<Event>), CoreError>;", "sections": [], "line": 452, "lastLine": 623, "tags": ["method", "private", "create-lock", "tmux", "writes-record", "reaches-tmux", "reaches-write"], "mentions": ["core/CreateOptions", "error/CoreError", "events/Event", "session/SessionId"]}, {"id": "core/TxCore::name_in_use", "name": "name_in_use", "title": "TxCore::name_in_use", "kind": "method", "module": "core", "visibility": "private", "owner": "core/TxCore", "doc": ["Whether a `Running` record other than `except` carries `name`."], "summary": "Whether a `Running` record other than `except` carries `name`.", "note": "Scans and parses **every** record via [[SessionStore::all]] under `create.lock`, on each create and rename. Records are never pruned except by [[TxCore::forget_session]], so this grows with history.", "noteFrom": null, "declaration": "fn name_in_use(&self, name: &str, except: Option<&SessionId>) -> Result<bool, CoreError>;", "display": "fn name_in_use(\n    &self,\n    name: &str,\n    except: Option<&SessionId>,\n) -> Result<bool, CoreError>;", "sections": [], "line": 625, "lastLine": 632, "tags": ["method", "private"], "mentions": ["error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::rename_session", "name": "rename_session", "title": "TxCore::rename_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Takes `create.lock` **then** `<id>.lock` — the documented order. Same name: no-op, no event. `NameTaken` against other running records. If running and live, renames the tmux session via its `$N` target (a tmux `duplicate session` also maps to `NameTaken`), then saves. Terminal records are renamed in the record only.", "noteFrom": "TxCore::rename_locked", "declaration": "pub fn rename_session(&self, id: &SessionId, name: &str) -> Result<Session, CoreError>;", "display": "pub fn rename_session(\n    &self,\n    id: &SessionId,\n    name: &str,\n) -> Result<Session, CoreError>;", "sections": [], "line": 636, "lastLine": 640, "tags": ["method", "public", "emits", "reaches-tmux", "reaches-write"], "mentions": ["error/CoreError", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::rename_locked", "name": "rename_locked", "title": "TxCore::rename_locked", "kind": "method", "module": "core", "visibility": "private", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Takes `create.lock` **then** `<id>.lock` — the documented order. Same name: no-op, no event. `NameTaken` against other running records. If running and live, renames the tmux session via its `$N` target (a tmux `duplicate session` also maps to `NameTaken`), then saves. Terminal records are renamed in the record only.", "noteFrom": null, "declaration": "fn rename_locked(&self, id: &SessionId, name: &str) -> Result<(Session, Vec<Event>), CoreError>;", "display": "fn rename_locked(\n    &self,\n    id: &SessionId,\n    name: &str,\n) -> Result<(Session, Vec<Event>), CoreError>;", "sections": [], "line": 642, "lastLine": 679, "tags": ["method", "private", "create-lock", "session-lock", "tmux", "writes-record", "reaches-tmux", "reaches-write"], "mentions": ["error/CoreError", "events/Event", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::update_ext", "name": "update_ext", "title": "TxCore::update_ext", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["Runs `f` on `ext[plugin]` (`Null` when absent) under the session lock and saves the", "record if the value changed; leaving it `Null` removes the key. Returns whether a write", "happened. `f` must not call back into the core (the lock is held)."], "summary": "Runs `f` on `ext[plugin]` (`Null` when absent) under the session lock and saves the record if the value changed; leaving it `Null` removes the key.", "note": "Under `<id>.lock`, hands the closure `ext[plugin]` (`Null` when absent) and saves only if it changed; leaving it `Null` removes the key. The closure must not call back into core — the lock is held.\n\n> [!warning] No event\n> Unlike every other mutation this emits nothing, so sinks and `log.jsonl` never see plugin state changes on a record.", "noteFrom": null, "declaration": "pub fn update_ext(&self, id: &SessionId, plugin: &str, f: impl FnOnce(&mut serde_json::Value)) -> Result<bool, CoreError>;", "display": "pub fn update_ext(\n    &self,\n    id: &SessionId,\n    plugin: &str,\n    f: impl FnOnce(&mut serde_json::Value),\n) -> Result<bool, CoreError>;", "sections": [], "line": 681, "lastLine": 709, "tags": ["method", "public", "session-lock", "writes-record", "reaches-write"], "mentions": ["error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::set_session_tags", "name": "set_session_tags", "title": "TxCore::set_session_tags", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Replaces the whole list. Same shape as the other mutations, but inlined: a block holds `<id>.lock` for load–modify–save, then [[TxCore::emit]] runs after the block. Allowed on terminal records.", "noteFrom": null, "declaration": "pub fn set_session_tags(&self, id: &SessionId, tags: Vec<String>) -> Result<Session, CoreError>;", "display": "pub fn set_session_tags(\n    &self,\n    id: &SessionId,\n    tags: Vec<String>,\n) -> Result<Session, CoreError>;", "sections": [], "line": 711, "lastLine": 726, "tags": ["method", "public", "session-lock", "emits", "writes-record", "reaches-write"], "mentions": ["error/CoreError", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::refresh_session", "name": "refresh_session", "title": "TxCore::refresh_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["One `list-sessions`; a `Running` record without a live `@tx-id` becomes `Exited`."], "summary": "One `list-sessions`; a `Running` record without a live `@tx-id` becomes `Exited`.", "note": "Under `<id>.lock`. A terminal record is returned untouched without asking tmux. Otherwise one [[Tmux::list_live]]; a running record whose `@tx-id` is missing becomes `Exited` via [[TxCore::mark_exited]]. Never revives.", "noteFrom": null, "declaration": "pub fn refresh_session(&self, id: &SessionId) -> Result<RefreshResult, CoreError>;", "display": "pub fn refresh_session(\n    &self,\n    id: &SessionId,\n) -> Result<RefreshResult, CoreError>;", "sections": [], "line": 728, "lastLine": 742, "tags": ["method", "public", "session-lock", "tmux", "emits", "reaches-tmux", "reaches-write"], "mentions": ["core/RefreshResult", "error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::refresh_all", "name": "refresh_all", "title": "TxCore::refresh_all", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["One `list-sessions` for every record; returns the records that changed. Records are", "scanned before tmux is listed: a record exists only after its tmux session does, so a", "record missing from a later listing has truly gone (the other order would mark a session", "created between the two calls as exited)."], "summary": "One `list-sessions` for every record; returns the records that changed.", "note": "Reads records **before** listing tmux: a record only exists after its tmux session does, so the reverse order would mark a session created in between as `Exited`. Each candidate is reloaded under its own lock (another process may have stopped it), and its event is emitted right after that lock drops.", "noteFrom": null, "declaration": "pub fn refresh_all(&self) -> Result<Vec<Session>, CoreError>;", "display": "pub fn refresh_all(&self) -> Result<Vec<Session>, CoreError>;", "sections": [], "line": 744, "lastLine": 774, "tags": ["method", "public", "session-lock", "tmux", "emits", "reaches-tmux", "reaches-write"], "mentions": ["error/CoreError", "session/Session"]}, {"id": "core/TxCore::mark_exited", "name": "mark_exited", "title": "TxCore::mark_exited", "kind": "method", "module": "core", "visibility": "private", "owner": "core/TxCore", "doc": ["Saves the record as `Exited`; the caller emits the returned event once its lock is gone."], "summary": "Saves the record as `Exited`; the caller emits the returned event once its lock is gone.", "note": "Saves `Exited` + `ended_at`; returns the event for the caller to emit once its lock is gone.", "noteFrom": null, "declaration": "fn mark_exited(&self, mut session: Session) -> Result<(Session, Event), CoreError>;", "display": "fn mark_exited(\n    &self,\n    mut session: Session,\n) -> Result<(Session, Event), CoreError>;", "sections": [], "line": 776, "lastLine": 783, "tags": ["method", "private", "writes-record", "reaches-write"], "mentions": ["error/CoreError", "events/Event", "session/Session"]}, {"id": "core/TxCore::get_execution_location", "name": "get_execution_location", "title": "TxCore::get_execution_location", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "A terminal record is `NotRunning` without asking tmux; otherwise looks the session up by `@tx-id`. No lock — it reads tmux, it doesn't write. `txc attach` execs `tmux -S <socket> attach -t $N` with `TMUX` unset.", "noteFrom": null, "declaration": "pub fn get_execution_location(&self, id: &SessionId) -> Result<ExecutionLocation, CoreError>;", "display": "pub fn get_execution_location(\n    &self,\n    id: &SessionId,\n) -> Result<ExecutionLocation, CoreError>;", "sections": [], "line": 785, "lastLine": 795, "tags": ["method", "public", "tmux", "reaches-tmux"], "mentions": ["core/ExecutionLocation", "error/CoreError", "session/SessionId"]}, {"id"  session had already vanished becomes", "`Exited` instead (what happened, not what was asked)."], "summary": "`kill-session`, then `Stopped`.", "note": "Under `<id>.lock`. If tmux still has it: `kill-session`, mark `Stopped`, event `stopped`. If it had already vanished: mark `Exited` instead — what happened, not what was asked. The record stays.", "noteFrom": null, "declaration": "pub fn stop_session(&self, id: &SessionId) -> Result<Session, CoreError>;", "display": "pub fn stop_session(\n    &self,\n    id: &SessionId,\n) -> Result<Session, CoreError>;", "sections": [], "line": 816, "lastLine": 839, "tags": ["method", "public", "session-lock", "tmux", "emits", "writes-record", "reaches-tmux", "reaches-write"], "mentions": ["error/CoreError", "session/Session", "session/SessionId"]}, {"id": "core/TxCore::forget_session", "name": "forget_session", "title": "TxCore::forget_session", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": ["Deletes the record (and its profile file). The tmux session, if any, keeps running and is", "no longer managed. `Ok(false)` when there was no record."], "summary": "Deletes the record (and its profile file).", "note": "Under `<id>.lock`: delete `<id>.json` and `profiles/<id>.md`. The tmux session keeps running unmanaged — and still holds the name, so a later create of that name gets `NameTaken` from tmux.\n\nThe load used to find the name for the event swallows errors (`.ok().flatten()`), so a corrupt record can still be forgotten.", "noteFrom": null, "declaration": "pub fn forget_session(&self, id: &SessionId) -> Result<bool, CoreError>;", "display": "pub fn forget_session(\n    &self,\n    id: &SessionId,\n) -> Result<bool, CoreError>;", "sections": [], "line": 841, "lastLine": 871, "tags": ["method", "public", "session-lock", "emits", "writes-record", "reaches-write"], "mentions": ["error/CoreError", "session/SessionId"]}, {"id": "core/TxCore::send_message", "name": "send_message", "title": "TxCore::send_message", "kind": "method", "module": "core", "visibility": "public", "owner": "core/TxCore", "doc": [], "summary": "", "note": "Holds the recipient's `<id>.lock` for the **whole** delivery, so concurrent senders never interleave keystrokes. Recipient must be `Running` and live, else `NotRunning`. A named sender must exist (any lifecycle). Framing via [[TxCore::envelope_for]], typing via [[deliver]].\n\n> [!warning] 300 ms under the lock\n> N concurrent messages to one agent take at least N × 300 ms. Intentional, but worth confirming as acceptable.", "noteFrom": null, "declaration": "pub fn send_message(&self, to: &SessionId, text: &str, opts: SendOptions) -> Result<DeliveryReceipt, CoreError>;", "display": "pub fn send_message(\n    &self,\n    to: &SessionId,\n    text: &str,\n    opts: SendOptions,\n) -> Result<DeliveryReceipt, CoreError>;", "sections": [], "line": 875, "lastLine": 912, "tags": ["method", "public", "session-lock", "emits", "reaches-tmux"], "mentions": ["core/DeliveryReceipt", "core/SendOptions", "error/CoreError", "session/SessionId"]}, {"id": "plugin/TxCore::plug", "name": "plug", "title": "TxCore::plug", "kind": "method", "module": "plugin", "visibility": "public", "owner": "core/TxCore", "doc": ["Registers every plugin not in `cfg.disabled`, in order. Fails on the first problem; the", "core may then hold a partial registration and the caller should exit."], "summary": "Registers every plugin not in `cfg.disabled`, in order.", "note": "[[load]] validates ids, unknown ids in the config and duplicates, then runs every enabled plugin's `register` on a fresh [[Registry]]. Then engines go to [[TxCore::register_engine]], sinks to [[TxCore::subscribe]], verbs through [[insert_verb]] (reserved / duplicate checks), resources into the host list.\n\n> [!warning] Partial registration on failure\n> Fails on the first problem and leaves whatever was registered so far. Fine for `txc`, which exits; sharp for any other embedder.", "noteFrom": null, "d ine", "target": "profile"}, {"source": "engine", "target": "session"}, {"source": "plugin", "target": "config"}, {"source": "plugin", "target": "core"}, {"source": "plugin", "target": "engine"}, {"source": "plugin", "target": "error"}, {"source": "plugin", "target": "events"}, {"source": "error", "target": "config"}, {"source": "error", "target": "engine"}, {"source": "error", "target": "profile"}, {"source": "error", "target": "session"}, {"source": "error", "target": "store"}, {"source": "error", "target": "tmux"}], "modules": [{"module": "core", "doc": "`TxCore`: the public operations. One struct, built once by `open`, owning its collaborators.", "imports": ["config", "engine", "error", "events", "locks", "messaging", "plugin", "profile", "session", "store", "tmux"], "hidden": false}, {"module": "config", "doc": "`CoreConfig`: everything the library needs, handed in by the caller. The library never reads the process environment.", "imports": ["error"], "hidden": false}, {"module": "session", "doc": "The session record: what core stores on disk for every managed session.", "imports": ["error"], "hidden": false}, {"module": "store", "doc": "`SessionStore`: `<dir>/<id>.json`, one file per record, written atomically (temp file in the same directory, then rename) so a reader never sees a half-written record.", "imports": ["session"], "hidden": true}, {"module": "locks", "doc": "Advisory file locks under `<state_dir>/locks/`: `create.lock` serializes name checks and `<id>.lock` serializes writes to (and keystrokes into) one session. `std::fs::File::lock`, no extra dependency. Lock order is always `create.lock` before `<id>.lock`.", "imports": ["session"], "hidden": true}, {"module": "tmux", "doc": "tx's own tmux server. Every call is `tmux -S <socket> -f <conf> …`, so the user's default server is never touched and `~/.tmux.conf` is never loaded. Sessions are addressed by exact name (`=name`) when created and by their `@tx-id` option afterwards: `list_live` is the only liveness signal and yields the `$N` / `%N` targets every other call uses.", "imports": ["session"], "hidden": true}, {"module": "events", "doc": "Events: what happened to one session. Every mutation produces [`Event`]s that go to the operation log (`<state_dir>/log.jsonl`, one compact JSON line `{\"ts\",\"actor\",\"type\",\"id\",\"name\",\"msg\"}` per event, appended with a single write on an `O_APPEND` descriptor so concurrent writers never tear a line) and then to every in-process [`EventSink`].", "imports": ["session"], "hidden": false}, {"module": "messaging", "doc": "Delivery of one message to one running session: the envelope is typed into the pane with `send-keys -l`, a pause lets the engine's input handling settle, then `Enter` submits it. A receipt means input was submitted: not read, not completed, not retried.", "imports": ["tmux"], "hidden": true}, {"module": "profile", "doc": "Profiles: a list of role names resolved against search dirs into one system-prompt text plus the skill directories the roles grant. `<dir>/<NAME>.md` from the last dir that has it is the base; every dir's `<NAME>.local.md` extends it, in dir order. A role file may open with a frontmatter block whose `skills: [a, b]` line (at any indent, so `tx:` nesting works) grants skills; each resolves to `<skill_dir>/<name>/` from the last skill dir that has it.", "imports": [], "hidden": false}, {"module": "engine", "doc": "Engines as plugins: one `EngineAdapter` per coding-agent CLI, each a pure function from a `LaunchRequest` to a `LaunchPlan`. Core applies the plan's workspace actions and starts the process, so an adapter is unit-testable without a filesystem or tmux.", "imports": ["error", "messaging", "profile", "session"], "hidden": false}, {"module": "plugin", "doc": "The plugin host. One trait, [`Plugin`]; a [`Registry`] with four slots (engines, event sinks, verbs, resources); a [`PluginConfig`] the front end fills from its own config format. Core never parses arguments or reads the environment: a [`Verb`] receives argv already split. A resource is a named static blob the core stores and lists but never reads.", "imports": ["config", "core", "engine", "error", "events"], "hidden": false}, {"module": "error", "doc": "The one error type every public operation returns.", "imports": ["config", "engine", "profile", "session", "store", "tmux"], "hidden": false}], "meta": {"ref": "poc @ 9b70814"}, "urls": {"core/SESSIONS_DIR": "tx_core/core/constant.SESSIONS_DIR.html", "core/LOCKS_DIR": "tx_core/core/constant.LOCKS_DIR.html", "core/PROFILES_DIR": "tx_core/core/constant.PROFILES_DIR.html", "core/LOG_FILE": "tx_core/core/constant.LOG_FILE.html", "core/TMUX_BINARY": "tx_core/core/constant.TMUX_BINARY.html", "core/SESSION_ID_ENV": "tx_core/core/constant.SESSION_ID_ENV.html", "core/TMUX_SOCKET_ENV": "tx_core/core/constant.TMUX_SOCKET_ENV.html", "core/STATE_DIR_ENV": "tx_core/core/constant.STATE_DIR_ENV.html", "core/DEFAULT_TMUX_CONF": "tx_core/core/constant.DEFAULT_TMUX_CONF.html", "core/CreateOptions": "tx_core/core/struct.CreateOptions.html", "core/LaunchOptions": "tx_core/core/enum.LaunchOptions.html", "core/ListFilter": "tx_core/core/struct.ListFilter.html", "core/SendOptions": "tx_core/core/struct.SendOptions.html", "core/DeliveryReceipt": "tx_core/core/struct.DeliveryReceipt.html", "core/RefreshResult": "tx_core/core/enum.RefreshResult.html", "core/ExecutionLocation": "tx_core/core/struct.ExecutionLocation.html", "core/TxCore": "tx_core/core/struct.TxCore.html", "core/validate_env": "tx_core/core/fn.validate_env.html", "core/session_vanished": "tx_core/core/fn.session_vanished.html", "core/merge_env": "tx_core/core/fn.merge_env.html", "core/event": "tx_core/core/fn.event.html", "core/store_io": "tx_core/core/fn.store_io.html", "config/MAX_SOCKET_PATH_BYTES": "tx_core/config/constant.MAX_SOCKET_PATH_BYTES.html", "config/SOCKET_FILE": "tx_core/config/constant.SOCKET_FILE.html", "config/CONF_FILE": "tx_core/config/constant.CONF_FILE.html", "config/CoreC const TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(b?r#+"[\s\S]*?"#+|b?r"[^"]*"|b?"(?:\\[\s\S]|[^"\\])*")|('(?:\\(?:x[0-9a-fA-F]{2}|u\{[0-9a-fA-F]+\}|.)|[^\\'\n])')|('[a-z_]\w*)|(#!?\[[^\]\n]*\]?)|(\b\d[\d_]*(?:\.\d+)?\b)|(\b[a-z_]\w*!)|(\bself\b)|(\b[A-Za-z_]\w*\b)/g;
function highlight(code, methodLink) {
  let html = "", last = 0, previous = "";
  for (const match of code.matchAll(TOKEN)) {
    if (match.index > last) html += escapeHtml(code.slice(last, match.index));
    const [text, comment, string, char, life, attr, number, macro, self, word] = match;
    let cls = "", target = null, method = false;
    if (comment) cls = "tok-com"; else if (string || char) cls = "tok-str"; else if (life) cls = "tok-life";
    else if (attr) cls = "tok-attr"; else if (number) cls = "tok-num"; else if (macro) cls = "tok-mac"; else if (self) cls = "tok-self";
    else if (word) {
      if (KEYWORDS.has(word)) cls = "tok-kw";
      else if (/^[A-Z]/.test(word)) cls = "tok-ty";
      else if (previous === "fn" || /^\s*\(/.test(code.slice(match.index + text.length))) cls = "tok-fn";
      if (previous === "fn" && methodLink) { target = methodLink; method = true; }
      else if (previous !== "fn" && /^[A-Z]/.test(word) && typeLinks.has(word)) target = typeLinks.get(word);
      previous = word;
    }
    let piece = escapeHtml(text);
    if (cls) piece = `<span class="${cls}">${piece}</span>`;
    if (target) piece = `<a class="ref${method ? " method-name" : ""}" data-id="${escapeHtml(target.id)}">${piece}</a>`;
    html += piece;
    last = match.index + text.length;
  }
  return html + escapeHtml(code.slice(last));
}
function inline(text) {
  const codes = [];
  text = text.replace(/`([^`]+)`/g, (_, code) => { codes.push(code); return `\u0000${codes.length - 1}\u0000`; });
  text = escapeHtml(text).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, title, alias) => {
    const card = byTitle.get(title.trim());
    const label = escapeHtml(alias ?? title);
    return card ? `<a class="ref" data-id="${escapeHtml(card.id)}">${label}</a>` : `<span class="priv" title="private — not an interface">${label}</span>`;
  });
  text = text.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return text.replace(/\u0000(\d+)\u0000/g, (_, index) => `<code>${escapeHtml(codes[index])}</code>`);
}
function noteHtml(note, from) {
  const title = from ? `Review note (on ${from})` : "Review note";
  const blocks = [];
  let body = [], current = { type: "note", title };
  const flush = () => { if (body.length) blocks.push({ ...current, body }); body = []; };
  for (const line of note.split("\n")) {
    const callout = line.match(/^> \[!(\w+)\]\s*(.*)$/);
    if (callout) { flush(); current = { type: callout[1], title: callout[2] }; continue; }
    if (line.startsWith(">")) { body.push(line.replace(/^>\s?/, "")); continue; }
    if (current.type !== "note") { flush(); current = { type: "note", title }; }
    body.push(line);
  }
  flush();
  return blocks.map((block) => {
    const paragraphs = block.body.join("\n").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    if (!paragraphs.length) return "";
    return `<div class="note ${block.type === "warning" ? "warning" : ""}"><div class="t">${block.type === "warning" ? "⚠ " : ""}${inline(block.title)}</div>${paragraphs.map((p) => `<p>${inline(p.replace(/\n/g, " "))}</p>`).join("")}</div>`;
  }).join("");
}
const hasWarning = (card) => card.note && card.note.includes("[!warning]");

// ---------- graph model -----------------------------------------------------------------------------
const TOGGLES = INTERNAL ? [
  ["showHas", "fields", true, "A holds B in a field or enum variant"],
  ["showCalls", "calls", true, "a function of A calls into B"],
  ["showUses", "signatures", false, "A's declaration or a method signature mentions B"],
  ["showErrors", "error types", false, "edges to *Error types"],
  ["showConsts", "constants", false, "show constants as nodes"],
  ["showImports", "imports", true, "module-level use crate::… with no item-level link"],
] : [
  ["showHas", "fields", true, "A holds B in a public field or enum variant"],
  ["showUses", "signatures", true, "A's declaration or a public method signature mentions B"],
  ["showErrors", "error types", false, "edges to *Error types (every operation returns CoreError)"],
  ["showModulePath", "module-path items", false, "pub items reachable only through a pub module path"],
  ["showImports", "imports", true, "module-level use crate::… with no item-level link"],
];
const state = { expanded: new Set(["core"]), showCalls: false, showConsts: false, showModulePath: false,
                selected: null, zoom: 1, panX: 0, panY: 0, layout: null };
for (const [key, , initial] of TOGGLES) state[key] = initial;
const STORAGE_KEY = "tx-structure-" + VIEW;
const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
if (EMBED && !saved) state.expanded = new Set();
if (saved) {
  state.expanded = new Set(saved.expanded);
  for (const [key] of TOGGLES) state[key] = saved.toggles[key];
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ expanded: [...state.expanded], toggles: Object.fromEntries(TOGGLES.map(([key]) => [key, state[key]])) }));
}
const moduleNames = ROWS.flat();
function visibleItems(module) {
  return DATA.cards.filter((card) => card.kind !== "method" && card.module === module
    && (INTERNAL ? (state.showConsts || card.kind !== "const")
                 : (isPublic(card) || state.showModulePath) && (state.showModulePath || card.kind !== "const")))
    .sort((a, b) => ["trait", "struct", "enum", "type", "fn", "const"].indexOf(a.kind) - ["trait", "struct", "enum", "type", "fn", "const"].indexOf(b.kind) || a.name.localeCompare(b.name));
}

const PILL_W = 186, PILL_H = 26, PILL_GAP = 7, HEAD = 46, COLLAPSED_W = 180, COLLAPSED_H = 52;
function layout() {
  const modules = new Map(), items = new Map();
  let y = 0;
  for (const row of ROWS) {
    const boxes = row.map((module) => {
      const list = visibleItems(module);
      if (!state.expanded.has(module) || !list.length) return { module, list, w: COLLAPSED_W, h: COLLAPSED_H, expanded: false };
      const columns = list.length <= 4 ? 1 : list.length <= 10 ? 2 : 3;
      const rows = Math.ceil(list.length / columns);
      return { module, list, columns, w: Math.max(COLLAPSED_W, columns * PILL_W + (columns - 1) * PILL_GAP + 24), h: HEAD + rows * (PILL_H + PILL_GAP) + 8, expanded: true };
    });
    const gap = 90;
    const total = boxes.reduce((sum, box) => sum + box.w, 0) + gap * (boxes.length - 1);
    let x = -total / 2;
    const height = Math.max(...boxes.map((box) => box.h));
    for (const box of boxes) {
      const placed = { ...box, x, y: y + (height - box.h) / 2 };
      modules.set(box.module, placed);
      if (box.expanded) box.list.forEach((card, index) => {
        const column = Math.floor(index / Math.ceil(box.list.length / box.columns));
        const rowIndex = index % Math.ceil(box.list.length / box.columns);
        items.set(card.id, { card, x: placed.x + 12 + column * (PILL_W + PILL_GAP), y: placed.y + HEAD + rowIndex * (PILL_H + PILL_GAP), w: PILL_W, h: PILL_H });
      });
      x += box.w + gap;
    }
    y += height + 120;
  }
  return { modules, items };
}

// One rule for the graph and the relation lists: an edge is listed exactly when it is drawn.
// Error types and constants are hidden by default, except the selected item's own edges.
function edgeShown(edge) {
  const source = cards.get(edge.source), target = cards.get(edge.target);
  const selected = cards.get(state.selected);
  const focus = selected && (selected.owner || selected.id);
  const own = edge.source === focus || edge.target === focus;
  if (!state[{ has: "showHas", calls: "showCalls", uses: "showUses" }[edge.kind]]) return false;
  if (!own && !state.showErrors && (isError(target) || isError(source))) return false;
  if (!INTERNAL && !state.showModulePath && (!isPublic(source) || !isPublic(target))) return false;
  if (!own && !state.showConsts && (source.kind === "const" || target.kind === "const")) return false;
  return true;
}

function edgeModel(lay) {
  const representative = (id) => lay.items.has(id) ? { key: id, box: lay.items.get(id), item: lay.items.get(id), module: cards.get(id).module } :
    { key: "module/" + cards.get(id).module, box: lay.modules.get(cards.get(id).module), module: cards.get(id).module };
  const aggregated = new Map();
  for (const edge of DATA.edges) {
    if (!edgeShown(edge)) continue;
    const a = representative(edge.source), b = representative(edge.target);
    if (a.key === b.key) continue;
    const key = a.key + ">" + b.key;
    if (!aggregated.has(key)) {
      const intra = a.module === b.module;
      // Across modules, an expanded module's edges leave/enter at its border, lined up with the item.
      const outer = (end) => intra || !end.item ? end : { ...end, box: lay.modules.get(end.module), align: end.item };
      aggregated.set(key, { key, a: outer(a), b: outer(b), edges: [], kind: "item", kinds: new Set(), intra });
    }
    aggregated.get(key).edges.push(edge);
    aggregated.get(key).kinds.add(edge.kind);
  }
  const list = [...aggregated.values()];
  if (state.showImports) {
    const linked = new Set(list.map((edge) => edge.a.module + ">" + edge.b.module));
    for (const edge of DATA.imports) {
      if (linked.has(edge.source + ">" + edge.target)) continue;
      if (!lay.modules.has(edge.source) || !lay.modules.has(edge.target)) continue;
      list.push({ key: "import:" + edge.source + ">" + edge.target, kind: "import", edges: [],
        a: { key: "module/" + edge.source, box: lay.modules.get(edge.source), module: edge.source },
        b: { key: "module/" + edge.target, box: lay.modules.get(edge.target), module: edge.target } });
    }
  }
  return list;
}

// Anchor points spread along a box side, so parallel edges don't stack.
function route(edges) {
  const slots = new Map();
  const side = (edge) => {
    const a = edge.a.box, b = edge.b.box;
    if (b.y >= a.y + a.h - 4) return ["bottom", "top"];
    if (b.y + b.h <= a.y + 4) return ["top", "bottom"];
    return b.x > a.x ? ["right", "left"] : ["left", "right"];
  };
  for (const edge of edges) {
    const [from, to] = side(edge);
    edge.from = from; edge.to = to;
    for (const [key, which, other] of [[edge.a.key + ":" + from, "fromIndex", edge.b], [edge.b.key + ":" + to, "toIndex", edge.a]]) {
      // keys are item ids even when anchored on the module border, so spreading is per item
      if (!slots.has(key)) slots.set(key, []);
      slots.get(key).push({ edge, which, other });
    }
  }
  for (const list of slots.values()) {
    list.sort((p, q) => (p.other.box.x + p.other.box.w / 2) - (q.other.box.x + q.other.box.w / 2) || (p.other.box.y - q.other.box.y));
    list.forEach((slot, index) => { slot.edge[slot.which] = [index, list.length]; });
  }
  const point = (box, sideName, [index, count], align) => {
    if (align) {
      const spread = (index - (count - 1) / 2) * 4;
      if (sideName === "bottom" || sideName === "top") return [Math.max(box.x + 8, Math.min(box.x + box.w - 8, align.x + align.w / 2 + spread)), sideName === "bottom" ? box.y + box.h : box.y];
      return [sideName === "right" ? box.x + box.w : box.x, align.y + align.h / 2 + spread];
    }
    const t = (index + 1) / (count + 1);
    if (sideName === "bottom") return [box.x + box.w * (0.15 + 0.7 * t), box.y + box.h];
    if (sideName === "top") return [box.x + box.w * (0.15 + 0.7 * t), box.y];
    if (sideName === "right") return [box.x + box.w, box.y + box.h * (0.2 + 0.6 * t)];
    return [box.x, box.y + box.h * (0.2 + 0.6 * t)];
  };
  for (const edge of edges) {
    const [x1, y1] = point(edge.a.box, edge.from, edge.fromIndex, edge.a.align), [x2, y2] = point(edge.b.box, edge.to, edge.toIndex, edge.b.align);
    let path;
    if (edge.from === "bottom" || edge.from === "top") {
      const bend = Math.max(40, Math.abs(y2 - y1) * 0.45) * (edge.from === "bottom" ? 1 : -1);
      path = `M${x1},${y1} C${x1},${y1 + bend} ${x2},${y2 - bend} ${x2},${y2}`;
      edge.mid = [(x1 + x2) / 2, (y1 + y2) / 2];
    } else {
      const bend = Math.max(40, Math.abs(x2 - x1) * 0.4) * (edge.from === "right" ? 1 : -1);
      path = `M${x1},${y1} C${x1 + bend},${y1} ${x2 - bend},${y2} ${x2},${y2}`;
      edge.mid = [(x1 + x2) / 2, (y1 + y2) / 2];
    }
    edge.path = path;
  }
}

// ---------- graph rendering -----------------------------------------------------------------------
const svg = document.getElementById("svg"), viewport = document.getElementById("viewport"), tip = document.getElementById("tip");
document.getElementById("defs").innerHTML = Object.entries({ ...MODULE_COLORS, grey: "#7a7a7a", hot: "#ffffff" }).map(([name, color]) =>
  `<marker id="arrow-${name}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${color}"/></marker>` +
  `<marker id="diamond-${name}" viewBox="0 0 12 12" refX="1" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,6 L6,2 L11,6 L6,10 z" fill="${color}"/></marker>`).join("");
let currentEdges = [];

function selectedRepresentative() {
  if (!state.selected) return null;
  const card = cards.get(state.selected);
  if (!card) return state.selected.startsWith("module/") ? state.selected : null;
  const base = card.kind === "method" ? cards.get(card.owner) : card;
  return state.layout.items.has(base.id) ? base.id : "module/" + base.module;
}

// Embedded there are two levels: the module map, and one object with its relations ("focus").
function render() {
  if (EMBED && state.mode === "focus") renderFocus(); else renderMap();
}
function edgeSvg(edge, index, hot, viaHot, showWeight) {
  const isImport = edge.kind === "import";

  const holds = !isImport && edge.kinds.has("has");
  const signatureOnly = !isImport && !holds && !edge.kinds.has("calls");
  const width = isImport ? 1.1 : (holds ? 1.6 : 1.1) + Math.log2(1 + weight) * 0.9;
  const dash = isImport ? 'stroke-dasharray="2 5"' : signatureOnly ? 'stroke-dasharray="6 4"' : "";
  return `<g class="edge${hot ? " hot" : ""}${viaHot ? " via-hot" : ""}" data-edge="${index}">
      <path class="line" d="${edge.path}" stroke="${isImport ? "#7a7a7a" : MODULE_COLORS[edge.a.module]}" stroke-width="${width}" ${dash} opacity="${isImport ? 0.45 : 0.7}" marker-end="url(#arrow-${color})" ${holds ? `marker-start="url(#diamond-${color})"` : ""}/>

const pillLabel = (card) => card.kind === "method" ? cards.get(card.owner).name + "::" + card.name : card.name;

  return `<g class="item${classes}${dimmed(card) ? " mod-path" : ""}${INTERNAL && card.visibility === "hidden" ? " hidden" : ""}" data-id="${escapeHtml(id)}">
      <rect class="pill" x="${pill.x}" y="${pill.y}" width="${pill.w}" height="${pill.h}" rx="6"/>
      <rect x="${pill.x + 7}" y="${pill.y + 6}" width="15" height="14" rx="3" fill="${badgeColor}"/>
      <text class="badge-t" x="${pill.x + 14.5}" y="${pill.y + 16.5}" text-anchor="middle">${card.kind[0].toUpperCase()}</text>
      <text class="name kind-${card.kind === "method" ? "fn" : card.kind}" x="${pill.x + 29}" y="${pill.y + 17.5}">${escapeHtml(label.length > 21 ? label.slice(0, 20) + "…" : label)}</text>
      ${hasWarning(card) ? `<circle class="warn-dot" cx="${pill.x + pill.w - 10}" cy="${pill.y + pill.h / 2}" r="3.5"/>` : ""}</g>`;

      <rect x="${box.x}" y="${box.y}" width="${box.w}" height="4" rx="2" fill="${MODULE_COLORS[module]}"/>
      <g class="mod-head" data-module="${module}">
        <rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.expanded ? 40 : box.h}" fill="transparent"/>
        <text class="mod-name" x="${box.x + 12}" y="${box.y + 23}">${EMBED ? module : module + ".rs"}</text>
        <text class="mod-sub" x="${box.x + 12}" y="${box.y + 38}">${subtitle}</text>
        ${toggle ? `<text class="mod-toggle" x="${box.x + box.w - 22}" y="${box.y + 25}">${box.expanded ? "−" : "+"}</text>` : ""}
      </g></g>`;
